<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 709" width="1100" height="709"><title id="title">Сборочная проекция XZ · G0 · ряд Y = 30 м</title><desc id="desc">Пуск на биотопливе · Ручная заправка двух горелок: обязательное ядро · bio-start · ревизия 067acffccc77f805358620c734fce423b3435a440b4ad4242f6808c82bb8aadf. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="709" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Сборочная проекция XZ · G0 · ряд Y = 30 м</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Пуск на биотопливе · Ручная заправка двух горелок: обязательное ядро ·</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">bio-start · ревизия</text><text x="32" y="117.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">067acffccc77f805358620c734fce423b3435a440b4ad4242f6808c82bb8aadf</text><line x1="32" y1="155.7" x2="1068" y2="155.7" stroke="#20282b" stroke-width="1.2" /><line x1="100" y1="324.7" x2="650" y2="324.7" stro