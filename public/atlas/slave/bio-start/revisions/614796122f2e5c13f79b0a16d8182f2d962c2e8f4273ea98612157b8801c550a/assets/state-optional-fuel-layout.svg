же состояние. Отсутствующие</text><text x="1020" y="508.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">поля и аннотации: лист ограничений выпуска.</text><line x1="100" y1="781.1" x2="566.666667" y2="781.1" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="750.1" x2="100" y2="786.1" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="785.1" x2="104" y2="777.1" stroke="#465256" stroke-width="1.2" /><line x1="566.666667" y1="750.1" x2="566.666667" y2="786.1" stroke="#465256" stroke-width="1.2" /><line x1="562.666667" y1="785.1" x2="570.666667" y2="777.1" stroke="#465256" stroke-width="1.2" /><text x="333.333333" y="804.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">40 м · 5 модулей по 8 м</text><line x1="62" y1="185.1" x2="62" y2="745.1" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="185.1" x2="95" y2="185.1" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="189.1" x2="66" y2="181.1" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="745.1" x2="95" y2="745.1" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="749.1" x2="66" y2="741.1" stroke="#465256" stroke-width="1.2" /><text x="47" y="465.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 465.1)">48 м</text><text x="32" y="840.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты машин заданы по</text><text x="32" y="860.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">центру. Оранжевый контур: явный осевой конверт или footprint, не</text><text x="32" y="880.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">коллизия и не игровой меш. Штриховка: отдельная зона</text><text x="32" y="901" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница обслуживания. Серые</text><text x="32" y="921.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки: оплачиваемые плиты; тёплые клетки: первый пуск. Пустые</text><text x="32" y="941.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки не означают готовый пол.</text><line x1="60" y1="991.9" x2="60" y2="965.9" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="981.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="1030.9" x2="1768" y2="1030.9" stroke="#465256" stroke-width="1.2" /><text x="32" y="1055.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1080.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы и грани электрических якорей не проверены.</text><text x="32" y="1100.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Контейнерам питание не требуется.</text></svg>
