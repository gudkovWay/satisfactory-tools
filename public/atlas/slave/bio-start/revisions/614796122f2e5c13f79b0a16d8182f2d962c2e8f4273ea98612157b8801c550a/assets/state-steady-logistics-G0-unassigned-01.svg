<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1229" width="1100" height="1229"><title id="title">Логистика · G0 · Z = 0 м</title><desc id="desc">Пуск на биотопливе · Ручная заправка двух горелок: обязательное ядро · bio-start · ревизия 067acffccc77f805358620c734fce423b3435a440b4ad4242f6808c82bb8aadf. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1229" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Логистика · G0 · Z = 0 м</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Пуск на биотопливе · Ручная заправка двух горелок: обязательное ядро ·</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">bio-start · ревизия</text><text x="32" y="117.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">067acffccc77f805358620c734fce423b3435a440b4ad4242f6808c82bb8aadf</text><line x1="32" y1="155.7" x2="1068" y2="155.7" stroke="#20282b" stroke-width="1.2" /><rect x="100" y="225.7" width="450" height="540" fill="none" stroke="#20282b" stroke-width="1.2" /><line x1="100" y1="765.7" x2="100" y2="225.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="100" y="215.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X0</text><line x1="190" y1="765.7" x2="190" y2="225.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="190" y="215.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X1</text><line x1="280" y1="765.7" x2="280" y2="225.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="280" y="215.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X2</text><line x1="370" y1="765.7" x2="370" y2="225.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="370" y="215.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X3</text><line x1="460" y1="765.7" x2="460" y2="225.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="460" y="215.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X4</text><line x1="550" y1="765.7" x2="550" y2="225.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="550" y="215.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X5</text><line x1="100" y1="765.7" x2="550" y2="765.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="769.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y0</text><line x1="100" y1="675.7" x2="550" y2="675.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="679.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y1</text><line x1="100" y1="585.7" x2="550" y2="585.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="589.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y2</text><line x1="100" y1="495.7" x2="550" y2="495.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="499.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y3</text><line x1="100" y1="405.7" x2="550" y2="405.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="409.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y4</text><line x1="100" y1="315.7" x2="550" y2="315.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="319.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y5</text><line x1="100" y1="225.7" x2="550" y2="225.7" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="229.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y6</text><text x="760" y="179.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">Ведомость трасс</text><rect x="133.75" y="529.45" width="112.5" height="112.5" fill="url(#clearance)" stroke="#20282b" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="145" y="540.7" width="90" height="90" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="190" y="589.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#20282b">BIO-01</text><rect x="187" y="629.95" width="6" height="6" fill="#faf9f5" stroke="#9b3b10" stroke-width="1.2" data-port-id="fuel" data-source-point="[8,11.8,1.5]"><title>fuel · input · face front · local XYZ [8, 11.8, 1.5] м · schematic</title></rect><text x="195" y="627.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#9b3b10">P1</text><rect x="187" y="582.7" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="power" data-source-point="[8,16,6]"><title>power · bidirectional · face unknown · local XYZ [8, 16, 6] м · schematic</title></rect><text x="195" y="580.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P2</text><rect x="268.75" y="529.45" width="112.5" height="112.5" fill="url(#clearance)" stroke="#20282b" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="280" y="540.7" width="90" height="90" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="325" y="589.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#20282b">BIO-02</text><rect x="322" y="629.95" width="6" height="6" fill="#faf9f5" stroke="#9b3b10" stroke-width="1.2" data-port-id="fuel" data-source-point="[20,11.8,1.5]"><title>fuel · input · face front · local XYZ [20, 11.8, 1.5] м · schematic</title></rect><text x="330" y="627.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#9b3b10">P1</text><rect x="322" y="582.7" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="power" data-source-point="[20,16,6]"><title>power · bidirectional · face unknown · local XYZ [20, 16, 6] м · schematic</title></rect><text x="330" y="580.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P2</text><rect x="420.625" y="568.825" width="33.75" height="33.75" fill="url(#clearance)" stroke="#20282b" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="431.875" y="580.075" width="11.25" height="11.25" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="437.5" y="588.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" font-weight="400" fill="#20282b">03</text><rect x="434.5" y="582.7" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="power" data-source-point="[30,16,7]"><title>power · bidirectional · face unknown · local XYZ [30, 16, 7] м · schematic</title></rect><text x="442.5" y="580.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P1</text><rect x="420.625" y="411.325" width="33.75" height="33.75" fill="url(#clearance)" stroke="#20282b" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="431.875" y="422.575" width="11.25" height="11.25" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="437.5" y="431.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" font-weight="400" fill="#20282b">04</text><rect x="434.5" y="425.2" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="power" data-source-point="[30,30,7]"><title>power · bidirectional · face unknown · local XYZ [30, 30, 7] м · schematic</title></rect><text x="442.5" y="423.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P1</text><text x="760" y="213.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Геометрия трасс</text><text x="760" y="234.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">отсутствует. Нужны</text><text x="760" y="254.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">layout.routes: id,</text><text x="760" y="274.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">kind, streamId, lane,</text><text x="760" y="295" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">rate, points</text><text x="760" y="315.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">[[x,y,z],...].</text><text x="760" y="335.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вымышленные ленты не</text><text x="760" y="355.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">показаны.</text><text x="760" y="388.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Все физические участки</text><text x="760" y="408.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">показаны один раз в</text><text x="760" y="428.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">проекции XY с</text><text x="760" y="449.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">отметками Z. Скорости</text><text x="760" y="469.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">последовательных</text><text x="760" y="489.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участков не</text><text x="760" y="510" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">суммировать. Машины</text><text x="760" y="530.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">относятся только к</text><text x="760" y="550.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">выбранному уровню.</text><text x="760" y="570.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Квадрат: вертикальный</text><text x="760" y="591.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участок; стрелки</text><text x="760" y="611.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">следуют points.</text><text x="760" y="631.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Пересечение линий не</text><text x="760" y="652.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означает соединение.</text><line x1="100" y1="801.7" x2="550" y2="801.7" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="770.7" x2="100" y2="806.7" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="805.7" x2="104" y2="797.7" stroke="#465256" stroke-width="1.2" /><line x1="550" y1="770.7" x2="550" y2="806.7" stroke="#465256" stroke-width="1.2" /><line x1="546" y1="805.7" x2="554" y2="797.7" stroke="#465256" stroke-width="1.2" /><text x="325" y="824.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">40 м · 5 модулей по 8 м</text><line x1="62" y1="225.7" x2="62" y2="765.7" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="225.7" x2="95" y2="225.7" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="229.7" x2="66" y2="221.7" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="765.7" x2="95" y2="765.7" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="769.7" x2="66" y2="761.7" stroke="#465256" stroke-width="1.2" /><text x="47" y="495.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 495.7)">48 м</text><text x="32" y="860.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты</text><text x="32" y="881" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">машин заданы по центру. Оранжевый контур: явный</text><text x="32" y="901.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт или footprint, не коллизия и не</text><text x="32" y="921.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровой меш. Штриховка: отдельная зона</text><text x="32" y="941.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница</text><text x="32" y="962.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания. Серые клетки: оплачиваемые плиты;</text><text x="32" y="982.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">тёплые клетки: первый пуск. Пустые клетки не</text><text x="32" y="1002.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означают готовый пол.</text><line x1="60" y1="1053.1" x2="60" y2="1027.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="1043.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="1092.1" x2="1068" y2="1092.1" stroke="#465256" stroke-width="1.2" /><text x="32" y="1117.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1141.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1161.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1182" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
