anchor="start" font-weight="700" fill="#20282b">м</text><text x="1462" y="193.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">Угол°</text><text x="1538" y="193.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">Частота%</text><text x="1648" y="193.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">Конверт</text><text x="1648" y="210.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">XYZ, м</text><line x1="1020" y1="232.3" x2="1768" y2="232.3" stroke="#465256" stroke-width="1.2" /><rect x="135" y="520.4" width="116.666667" height="116.666667" fill="url(#clearance)" stroke="#20282b" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="146.666667" y="532.066667" width="93.333333" height="93.333333" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="193.333333" y="582.733333" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#20282b">BIO-01</text><rect x="190.333333" y="624.733333" width="6" height="6" fill="#faf9f5" stroke="#9b3b10" stroke-width="1.2" data-port-id="fuel" data-source-point="[8,11.8,1.5]"><title>fuel · input · face front · local XYZ [8, 11.8, 1.5] м · schematic</title></rect><text x="198.333333" y="622.733333" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#9b3b10">P1</text><rect x="190.333333" y="575.733333" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="power" data-source-point="[8,16,6]"><title>power · bidirectional · face unknown · local XYZ [8, 16, 6] м · schematic</title></rect><text x="198.333333" y="573.733333" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P2</tex