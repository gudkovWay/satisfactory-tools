ns, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P1</text><text x="1020" y="311.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">M02 ·</text><text x="1020" y="328.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">POLE-01</text><text x="1162" y="311.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">pole</text><text x="1312" y="311.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">30 / 16</text><text x="1407" y="311.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1462" y="311.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1538" y="311.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1648" y="311.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">1×1×7</text><line x1="1020" y1="349.9" x2="1768" y2="349.9" stroke="#c5cbc8" stroke-width="1.2" /><text x="1020" y="377.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">Координаты XY: центры; Z: основание. Конверт осевой,</text><text x="1020" y="396.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">повторно не поворачивается. Частота в этой таблице</text><text x="1020" y="415.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">округлена до 0.001%; точное исходное значение сохранено в</text><text x="1020" y="434.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">документе. Поворот: rotationDeg в осях проекта, не</text><text x="1020" y="453.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">подтверждение native yaw. unknown: rotationDeg не задан;</text><text x="1020" y="472.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">направление не предполагается. Полные порты P,</text><text x="1020" y="491" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">componentId и processId: сборочные листы этого уровня по</text><text x="1020" y="509.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">точному ряду Y; выберите то же состояние. Отсутствующие</text><text x="1020" y="528.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">поля и аннотации: лист ограничений выпуска.</text><line x1="100" y1="801.4" x2="566.666667" y2="801.4" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="770.4" x2="100" y2="806.4" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="805.4" x2="104" y2="797.4" stroke="#465256" stroke-width="1.2" /><line x1="566.666667" y1="770.4" x2="566.666667" y2="806.4" stroke="#465256" stroke-width="1.2" /><line x1="562.666667" y1="805.4" x2="570.666667" y2="797.4" stroke="#465256" stroke-width="1.2" /><text x="333.333333" y="824.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">40 м · 5 модулей по 8 м</text><line x1="62" y1="205.4" x2="62" y2="765.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="205.4" x2="95" y2="205.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="209.4" x2="66" y2="201.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="765.4" x2="95" y2="765.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="769.4" x2="66" y2="761.4" stroke="#465256" stroke-width="1.2" /><text x="47" y="485.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 485.4)">48 м</text><text x="32" y="860.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты машин заданы по</text><text x="32" y="880.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">центру. Оранжевый контур: явный осевой конверт или footprint, не</text><text x="32" y="901" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">коллизия и не игровой меш. Штриховка: отдельная зона</text><text x="32" y="921.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница обслуживания. Серые</text><text x="32" y="941.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки: оплачиваемые плиты; тёплые клетки: первый пуск. Пустые</text><text x="32" y="961.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки не означают готовый пол.</text><line x1="60" y1="1012.2" x2="60" y2="986.2" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="1002.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="1051.2" x2="1768" y2="1051.2" stroke="#465256" stroke-width="1.2" /><text x="32" y="1076.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1100.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы и грани электрических якорей не проверены.</text><text x="32" y="1120.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Контейнерам питание не требуется.</text></svg>
