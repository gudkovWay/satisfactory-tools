<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1246" width="1100" height="1246"><title id="title">Направленные материальные потоки · соединения и группы</title><desc id="desc">Пуск на биотопливе · bio-start · ревизия 067acffccc77f805358620c734fce423b3435a440b4ad4242f6808c82bb8aadf. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1246" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Направленные материальные потоки ·</text><text x="32" y="70.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">соединения и группы</text><text x="32" y="111.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Пуск на биотопливе · bio-start · ревизия</text><text x="32" y="131.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">067acffccc77f805358620c734fce423b3435a440b4ad4242f6808c82bb8aadf</text><line x1="32" y1="170.2" x2="1068" y2="170.2" stroke="#20282b" stroke-width="1.2" /><text x="32" y="194.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Каждая строка показывает направленное соединение, а не физическую трассу.</text><text x="32" y="214.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Несколько источников слева подают суммарный расход справа. Разделение</text><text x="32" y="234.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">между источниками не предполагается.</text><rect x="32" y="271.1" width="190" height="112" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="297.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">Biofuel</text><line x1="222" y1="327.1" x2="265" y2="327.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="285" y="295.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">S01 ·</text><text x="285" y="315.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">optional-fuel-stream-0001</text><text x="285" y="335.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Solid Biofuel</text><text x="285" y="356" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">40 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="327.1" x2="785" y2="327.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="271.1" width="268" height="112" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="297.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">STOCK</text><rect x="32" y="407.1" width="190" height="112" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="433.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">Biomass_Woo</text><text x="47" y="458.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">d</text><line x1="222" y1="463.1" x2="265" y2="463.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="285" y="431.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">S02 ·</text><text x="285" y="451.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">optional-fuel-stream-0002</text><text x="285" y="471.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Biomass</text><text x="285" y="492" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">80 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="463.1" x2="785" y2="463.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="407.1" width="268" height="112" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="433.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">Biofuel</text><rect x="32" y="543.1" width="190" height="112" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="569.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">RAW</text><line x1="222" y1="599.1" x2="265" y2="599.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="285" y="567.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">S03 ·</text><text x="285" y="587.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">optional-fuel-stream-0003</text><text x="285" y="607.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Wood</text><text x="285" y="628" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">16 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="599.1" x2="785" y2="599.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="543.1" width="268" height="112" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="569.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">Biomass_Wood</text><text x="32" y="687.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#20282b">Производственные группы и фактические размещения</text><text x="32" y="728.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Biofuel · Solid Biofuel · Конструктор</text><text x="32" y="748.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Расчёт: 1 машин; частота 13.333333 %. Размещено: 1.</text><text x="32" y="768.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">ID: FUEL-01</text><text x="52" y="795" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вход группы: Biomass · 80 шт/мин</text><text x="52" y="815.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Валовой выход группы: Solid Biofuel · 40 шт/мин</text><text x="32" y="853.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Biomass_Wood · Biomass (Wood) · Конструктор</text><text x="32" y="873.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Расчёт: 1 машин; частота 5.333333 %. Размещено: 1.</text><text x="32" y="894.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">ID: WOOD-01</text><text x="52" y="920.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вход группы: Wood · 16 шт/мин</text><text x="52" y="940.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Валовой выход группы: Biomass · 80 шт/мин</text><text x="32" y="979.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#20282b">Целевой нетто-выпуск из документа</text><text x="32" y="1016.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Solid Biofuel · 40 шт/мин</text><text x="32" y="1044.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Цель не добавляет несуществующую выходную трассу. Вывоз и буфер требуют</text><text x="32" y="1064.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">собственного stream и layout.routes.</text><line x1="32" y1="1109" x2="1068" y2="1109" stroke="#465256" stroke-width="1.2" /><text x="32" y="1134" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1158.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1178.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1198.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
