, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y3</text><line x1="100" y1="385.4" x2="550" y2="385.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="389.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y4</text><line x1="100" y1="295.4" x2="550" y2="295.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="299.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y5</text><line x1="100" y1="205.4" x2="550" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="209.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y6</text><text x="760" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">Ведомость трасс</text><rect x="268.75" y="317.9" width="112.5" height="135" fill="url(#clearance)" stroke="#20282b" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="280" y="329.15" width="90" height="112.5" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="325" y="389.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#20282b">M01</text><rect x="322" y="440.9" width="6" height="6" fill="#faf9f5" stroke="#9b3b10" stroke-width="1.2" data-port-id="in" data-source-point="[20,26.8,1.5]"><title>in · input · face front · local XYZ [20, 26.8, 1.5] м · schematic</title></rect><text x="330" y="438.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#9b3b10">P1</text><rect x="322" y="323.9" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="out" data-source-point="[20,37.2,1.5]"><title>out · output · face rear · local XYZ [20, 37.2, 1.5] м · schematic</title></rect><text x="330" y="321.9" font-family="Onest, DejaVu