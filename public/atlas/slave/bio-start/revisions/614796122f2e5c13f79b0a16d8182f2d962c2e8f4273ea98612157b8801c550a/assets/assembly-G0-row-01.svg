" fill="#20282b">совпадать. Толщина пола и опоры не придуманы.</text><line x1="32" y1="1108.8" x2="1068" y2="1108.8" stroke="#465256" stroke-width="1.2" /><text x="32" y="1133.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1158.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1178.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1198.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
