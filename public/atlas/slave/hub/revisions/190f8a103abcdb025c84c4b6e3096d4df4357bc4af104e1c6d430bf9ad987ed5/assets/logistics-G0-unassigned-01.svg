<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1208" width="1100" height="1208"><title id="title">Логистика · G0 · Z = 0 м</title><desc id="desc">HUB и покупки технологий · hub · ревизия c67bdb79bd825a0fc682712aa483be43240dba18e0a5a232448a8a887fabc13f. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1208" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Логистика · G0 · Z = 0 м</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">HUB и покупки технологий · hub · ревизия</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">c67bdb79bd825a0fc682712aa483be43240dba18e0a5a232448a8a887fabc13f</text><line x1="32" y1="135.4" x2="1068" y2="135.4" stroke="#20282b" stroke-width="1.2" /><rect x="100" y="205.4" width="308.571429" height="540" fill="none" stroke="#20282b" stroke-width="1.2" /><line x1="100" y1="745.4" x2="100" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="100" y="195.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X0</text><line x1="177.142857" y1="745.4" x2="177.142857" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="177.142857" y="195.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X1</text><line x1="254.285714" y1="745.4" x2="254.285714" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="254.285714" y="195.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X2</text><line x1="331.428571" y1="745.4" x2="331.428571" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="331.428571" y="195.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X3</text><line x1="408.571429" y1="745.4" x2="408.571429" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="408.571429" y="195.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X4</text><line x1="100" y1="745.4" x2="408.571429" y2="745.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="749.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y0</text><line x1="100" y1="668.257143" x2="408.571429" y2="668.257143" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="672.257143" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y1</text><line x1="100" y1="591.114286" x2="408.571429" y2="591.114286" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="595.114286" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y2</text><line x1="100" y1="513.971429" x2="408.571429" y2="513.971429" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="517.971429" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y3</text><line x1="100" y1="436.828571" x2="408.571429" y2="436.828571" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="440.828571" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y4</text><line x1="100" y1="359.685714" x2="408.571429" y2="359.685714" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="363.685714" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y5</text><line x1="100" y1="282.542857" x2="408.571429" y2="282.542857" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="286.542857" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y6</text><line x1="100" y1="205.4" x2="408.571429" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="209.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y7</text><text x="760" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">Ведомость трасс</text><rect x="186.785714" y="350.042857" width="135" height="250.714286" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="254.285714" y="479.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#20282b">M01</text><text x="760" y="193.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Геометрия трасс</text><text x="760" y="213.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">отсутствует. Нужны</text><text x="760" y="234.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">layout.routes: id,</text><text x="760" y="254.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">kind, streamId, lane,</text><text x="760" y="274.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">rate, points</text><text x="760" y="295" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">[[x,y,z],...].</text><text x="760" y="315.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вымышленные ленты не</text><text x="760" y="335.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">показаны.</text><text x="760" y="367.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Все физические участки</text><text x="760" y="388.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">показаны один раз в</text><text x="760" y="408.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">проекции XY с</text><text x="760" y="428.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">отметками Z. Скорости</text><text x="760" y="449.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">последовательных</text><text x="760" y="469.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участков не</text><text x="760" y="489.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">суммировать. Машины</text><text x="760" y="510" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">относятся только к</text><text x="760" y="530.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">выбранному уровню.</text><text x="760" y="550.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Квадрат: вертикальный</text><text x="760" y="570.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участок; стрелки</text><text x="760" y="591.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">следуют points.</text><text x="760" y="611.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Пересечение линий не</text><text x="760" y="631.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означает соединение.</text><line x1="100" y1="781.4" x2="408.571429" y2="781.4" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="750.4" x2="100" y2="786.4" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="785.4" x2="104" y2="777.4" stroke="#465256" stroke-width="1.2" /><line x1="408.571429" y1="750.4" x2="408.571429" y2="786.4" stroke="#465256" stroke-width="1.2" /><line x1="404.571429" y1="785.4" x2="412.571429" y2="777.4" stroke="#465256" stroke-width="1.2" /><text x="254.285714" y="804.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">32 м · 4 модулей по 8 м</text><line x1="62" y1="205.4" x2="62" y2="745.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="205.4" x2="95" y2="205.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="209.4" x2="66" y2="201.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="745.4" x2="95" y2="745.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="749.4" x2="66" y2="741.4" stroke="#465256" stroke-width="1.2" /><text x="47" y="475.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 475.4)">56 м</text><text x="32" y="840.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты</text><text x="32" y="860.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">машин заданы по центру. Оранжевый контур: явный</text><text x="32" y="881" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт или footprint, не коллизия и не</text><text x="32" y="901.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровой меш. Штриховка: отдельная зона</text><text x="32" y="921.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница</text><text x="32" y="941.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания. Серые клетки: оплачиваемые плиты;</text><text x="32" y="962.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">тёплые клетки: первый пуск. Пустые клетки не</text><text x="32" y="982.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означают готовый пол.</text><line x1="60" y1="1032.8" x2="60" y2="1006.8" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="1022.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="1071.8" x2="1068" y2="1071.8" stroke="#465256" stroke-width="1.2" /><text x="32" y="1096.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1121.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1141.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1161.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
