roke-width="1.2" /><text x="91" y="349.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y5</text><line x1="100" y1="265.1" x2="420" y2="265.1" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="269.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y6</text><line x1="100" y1="185.1" x2="420" y2="185.1" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="189.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y7</text><text x="1020" y="139.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">Ведомость размещений</text><text x="1020" y="173.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">ID</text><text x="1162" y="173.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">Название</text><text x="1312" y="173.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">X / Y,</text><text x="1312" y="190.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">м</text><text x="1407" y="173.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">Z,</text><text x="1407" y="190.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">м</text><text x="1462" y="173.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">Угол°</text><text x="1538" y="173.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">Частота%</text><text x="1648" y="173.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">Конверт</text><text x="1648" y="190.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700" fill="#20282b">XYZ, м</text><line x1="1020" y1="212" x2="1768" y2="212" stroke="#465256" stroke-width="1.2" /><rect x="190" y="335.1" width="140" height="260" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="260" y="469.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#20282b">M01</text><text x="1020" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">M01 ·</text><text x="1020" y="249.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">HUB-EXISTIN</text><text x="1020" y="266.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">G</text><text x="1162" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">Build_Tradi</text><text x="1162" y="249.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">ngPost_C</text><text x="1312" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">16 / 28</text><text x="1407" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1462" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">unkno</text><text x="1462" y="249.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">wn</text><text x="1538" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1648" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">14×26×28</text><line x1="1020" y1="288.2" x2="1768" y2="288.2" stroke="#c5cbc8" stroke-width="1.2" /><text x="1020" y="316.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">Координаты XY: центры; Z: основание. Конверт осевой,</text><text x="1020" y="335.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">повторно не поворачивается. Частота в этой таблице</text><text x="1020" y="353.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">округлена до 0.001%; точное исходное значение сохранено в</text><text x="1020" y="372.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">документе. Поворот: rotationDeg в осях проекта, не</text><text x="1020" y="391.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">подтверждение native yaw. unknown: rotationDeg не задан;</text><text x="1020" y="410.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">направление не предполагается. Полные порты P,</text><text x="1020" y="429.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">componentId и processId: сборочные листы этого уровня по</text><text x="1020" y="448.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">точному ряду Y; выберите то же состояние. Отсутствующие</text><text x="1020" y="467" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">поля и аннотации: лист ограничений выпуска.</text><line x1="100" y1="781.1" x2="420" y2="781.1" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="750.1" x2="100" y2="786.1" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="785.1" x2="104" y2="777.1" stroke="#465256" stroke-width="1.2" /><line x1="420" y1="750.1" x2="420" y2="786.1" stroke="#465256" stroke-width="1.2" /><line x1="416" y1="785.1" x2="424" y2="777.1" stroke="#465256" stroke-width="1.2" /><text x="260" y="804.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">32 м · 4 модулей по 8 м</text><line x1="62" y1="185.1" x2="62" y2="745.1" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="185.1" x2="95" y2="185.1" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="189.1" x2="66" y2="181.1" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="745.1" x2="95" y2="745.1" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="749.1" x2="66" y2="741.1" stroke="#465256" stroke-width="1.2" /><text x="47" y="465.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 465.1)">56 м</text><text x="32" y="840.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты машин заданы по</text><text x="32" y="860.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">центру. Оранжевый контур: явный осевой конверт или footprint, не</text><text x="32" y="880.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">коллизия и не игровой меш. Штриховка: отдельная зона</text><text x="32" y="901" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница обслуживания. Серые</text><text x="32" y="921.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки: оплачиваемые плиты; тёплые клетки: первый пуск. Пустые</text><text x="32" y="941.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки не означают готовый пол.</text><line x1="60" y1="991.9" x2="60" y2="965.9" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="981.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="1030.9" x2="1768" y2="1030.9" stroke="#465256" stroke-width="1.2" /><text x="32" y="1055.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1080.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы и грани электрических якорей не проверены.</text><text x="32" y="1100.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Контейнерам питание не требуется.</text></svg>
