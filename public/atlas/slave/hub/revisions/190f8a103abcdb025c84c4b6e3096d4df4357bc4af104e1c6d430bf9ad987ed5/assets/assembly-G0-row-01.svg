<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 969" width="1100" height="969"><title id="title">Сборочная проекция XZ · G0 · ряд Y = 28 м</title><desc id="desc">HUB и покупки технологий · hub · ревизия c67bdb79bd825a0fc682712aa483be43240dba18e0a5a232448a8a887fabc13f. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="969" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Сборочная проекция XZ · G0 · ряд Y = 28 м</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">HUB и покупки технологий · hub · ревизия</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">c67bdb79bd825a0fc682712aa483be43240dba18e0a5a232448a8a887fabc13f</text><line x1="32" y1="135.4" x2="1068" y2="135.4" stroke="#20282b" stroke-width="1.2" /><line x1="100" y1="584.4" x2="545.714286" y2="584.4" stroke="#20282b" stroke-width="1.2" /><text x="100" y="608.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">Отметка уровня G0 · Z 0 м, не доказательство пола</text><text x="760" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">Ведомость сборки</text><text x="760" y="185.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">ряда (не порядок</text><text x="760" y="211.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">монтажа)</text><rect x="225.357143" y="194.4" width="195" height="390" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="322.857143" y="393.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#20282b">M01</text><text x="760" y="247.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">1. M01 · HUB-EXISTING</text><text x="760" y="268" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Build_TradingPost_C</text><text x="760" y="288.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Основание Z 0; верх Z</text><text x="760" y="308.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">28 м; высота 28 м.</text><text x="760" y="328.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">rotationDeg: None</text><text x="760" y="357.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">componentId:</text><text x="760" y="374.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">Build_TradingPost_C</text><text x="760" y="392" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">processId: не задан</text><text x="760" y="417.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">Порты не заданы; якоря не</text><text x="760" y="434.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">добавлены.</text><line x1="100" y1="620.4" x2="545.714286" y2="620.4" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="589.4" x2="100" y2="625.4" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="624.4" x2="104" y2="616.4" stroke="#465256" stroke-width="1.2" /><line x1="545.714286" y1="589.4" x2="545.714286" y2="625.4" stroke="#465256" stroke-width="1.2" /><line x1="541.714286" y1="624.4" x2="549.714286" y2="616.4" stroke="#465256" stroke-width="1.2" /><text x="322.857143" y="643.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">Площадка по X: 32 м</text><line x1="62" y1="194.4" x2="62" y2="584.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="194.4" x2="95" y2="194.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="198.4" x2="66" y2="190.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="584.4" x2="95" y2="584.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="588.4" x2="66" y2="580.4" stroke="#465256" stroke-width="1.2" /><text x="47" y="389.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 389.4)">Z 0 … 28 м</text><text x="32" y="686.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Это проекция только указанного ряда, не разрез</text><text x="32" y="706.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровых мешей. Оранжевый контур задаёт явный</text><text x="32" y="727" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт. Пунктир показывает явно заданную</text><text x="32" y="747.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">высоту обслуживания. P: только исходные</text><text x="32" y="767.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">schematic-порты; в XZ точки разных Y могут</text><text x="32" y="787.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">совпадать. Толщина пола и опоры не придуманы.</text><line x1="32" y1="832.2" x2="1068" y2="832.2" stroke="#465256" stroke-width="1.2" /><text x="32" y="857.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="881.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="901.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="922.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
