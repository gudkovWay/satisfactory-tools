<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img"><title>HUB и исследовательский двор</title><rect width="100%" height="100%" fill="#f4f5f3"/><text x="40" y="35" fill="#202521" font-family="sans-serif" font-size="24">HUB и исследовательский двор</text><text x="40" y="65" fill="#202521" font-family="sans-serif" font-size="16">32×32м · локальные координаты · задняя сторона+Y</text><path d="M70.0 100v640.0" stroke="#d8ddd8"/><path d="M230.0 100v640.0" stroke="#d8ddd8"/><path d="M390.0 100v640.0" stroke="#d8ddd8"/><path d="M550.0 100v640.0" stroke="#d8ddd8"/><path d="M710.0 100v640.0" stroke="#d8ddd8"/><path d="M70 100.0h640.0" stroke="#d8ddd8"/><path d="M70 260.0h640.0" stroke="#d8ddd8"/><path d="M70 420.0h640.0" stroke="#d8ddd8"/><path d="M70 580.0h640.0" stroke="#d8ddd8"/><path d="M70 740.0h640.0" stroke="#d8ddd8"/><rect x="150.0" y="260.0" width="480.0" height="320.0" fill="#f4e6d2" stroke="#96500b"/><text x="153.0" y="274.0" fill="#202521" font-family="sans-serif" font-size="14">Existing HUB envelope</text><text x="70" y="800" fill="#202521" font-family="sans-serif" font-size="15">Сетка8м · центр конверта: (-1835.3383, 2852.81) · абсолютный уровень пола после обмера</text><text x="70" y="830" fill="#202521" font-family="sans-serif" font-size="14">Входы/выходы ориентировать по голограмме; сервисный доступ и рельеф проверить до тиражирования.</text><text x="70" y="860" fill="#202521" font-family="sans-serif" font-size="14">Размерная схема. Не игровой скриншот и не подтверждённая коллизия.</text></svg>