y"],</text><text x="475" y="766.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"ownerProjectId": "iron-home", "rate": 240,</text><text x="475" y="785.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"schematic": true, "selectedOperatingState":</text><text x="475" y="804.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"first-plate", "selectedStateRate": 120,</text><text x="475" y="823.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"stageIds": ["plate-chain"], "stateRates":</text><text x="475" y="841.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">{"first-plate": 120, "steady": 240}}</text><text x="475" y="868.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="700" fill="#20282b">Точные вершины: № [worldX, worldY,</text><text x="475" y="887.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="700" fill="#20282b">relativeZ], м</text><text x="475" y="906.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">1: [-1909.65, 2783.6200000000003, 1.5]</text><text x="475" y="925.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">2: [-1909.65, 2782.8, 1.5]</text><text x="475" y="944.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">3: [-1909.65, 2782.8, 9.5]</text><text x="475" y="963.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">4: [-1890.5, 2713.5, 9.5]</text><text x="475" y="981.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">5: [-1880.8, 2713.5, 9.5]</text><text x="475" y="1000.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">BELT-SUPPORT-09: world [-1890.5, 2713.5],</text><text x="475" y="1019.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">основание Z 4, верх стойки Z 9.5 м.</text><text x="475" y="1038.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">BELT-SUPPORT-10: world [-1900.075, 2748.15],</text><text x="475" y="1057.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">основание Z 0, верх стойки Z 9.5 м.</text><line x1="32" y1="1092.15" x2="1068" y2="1092.15" stroke="#465256" stroke-width="1.2" /><line x1="32" y1="1128.15" x2="1068" y2="1128.15" stroke="#465256" stroke-width="1.2" /><text x="32" y="1153.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1177.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1197.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1218.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
