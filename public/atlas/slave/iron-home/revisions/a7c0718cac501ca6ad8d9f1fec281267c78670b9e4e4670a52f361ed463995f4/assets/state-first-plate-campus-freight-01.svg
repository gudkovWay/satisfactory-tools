<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1265" width="1100" height="1265"><title id="title">Кампус · грузовые связи · first-plate · лист 1</title><desc id="desc">Домашнее железо · first-plate · iron-home · ревизия d173a9198130a0c1c6c0b9d158b34d773d59db8139e47054a4569e26dda0bd61. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1265" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Кампус · грузовые связи · first-plate ·</text><text x="32" y="70.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">лист 1</text><text x="32" y="111.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Домашнее железо · first-plate · iron-home · ревизия</text><text x="32" y="131.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">d173a9198130a0c1c6c0b9d158b34d773d59db8139e47054a4569e26dda0bd61</text><line x1="32" y1="170.2" x2="1068" y2="170.2" stroke="#20282b" stroke-width="1.2" /><text x="32" y="194.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Каждая связь принадлежит только ownerProjectId и показана один раз в</text><text x="32" y="214.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">комплекте указанного состояния. Геометрия: pointsWorldXYRelativeZ, метры;</text><text x="32" y="234.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">X вправо, +Y вверх. Это НЕ локальные координаты площадки. Z: общий</text><text x="32" y="255.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">предложенный относительный datum, абсолютная высота и рельеф неизвестны.</text><text x="32" y="275.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Квадраты обозначают исходные вершины; совпадение XY не отменяет</text><text x="32" y="295.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">вертикальный участок. Пересечение линий не означает соединение. Питание не</text><text x="32" y="316" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">задаёт направление потока или вымышленный расход MW.</text><text x="32" y="348.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">Преобразование локальных XY проекта в world XY (только из источника):</text><text x="32" y="367.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">{"absoluteFloorZ": "unknown", "gamePortTransforms": "unknown", "placementXY":</text><text x="32" y="386" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"centres", "xyOrigin_m": [-1894.0, 2704.0]}</text><text x="32" y="420.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">iron-home-RAW-WORLD</text><polyline points="194.741871,474.95 194.741871,477.522732 194.741871,477.522732 254.824586,694.95 285.258129,694.95" fill="none" stroke="#20282b" stroke-width="2" marker-end="url(#arrow)" data-source-points-world-xy-relative-z="[[-1909.65,2783.6200000000003,1.5],[-1909.65,2782.8,1.5],[-1909.65,2782.8,9.5],[-1890.5,2713.5,9.5],[-1880.8,2713.5,9.5]]" data-owner-project-id="iron-home"><title>iron-home-RAW-WORLD</title></polyline><rect x="191.741871" y="471.95" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" /><text x="200.741871" y="468.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#20282b">1</text><rect x="191.741871" y="474.522732" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" /><text x="200.741871" y="471.522732" font-family="Onest, DejaVu Sans, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#20282b">2/3</text><rect x="251.824586" y="691.95" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" /><text x="260.824586" y="688.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#20282b">4</text><rect x="282.258129" y="691.95" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" /><text x="291.258129" y="688.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#20282b">5</text><rect x="250.824586" y="690.95" width="8" height="8" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2"><title>BELT-SUPPORT-09</title></rect><text x="261.824586" y="708.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">09</text><rect x="220.783229" y="582.236366" width="8" height="8" fill="#f3dfce" stroke="#9b3b10" stroke-