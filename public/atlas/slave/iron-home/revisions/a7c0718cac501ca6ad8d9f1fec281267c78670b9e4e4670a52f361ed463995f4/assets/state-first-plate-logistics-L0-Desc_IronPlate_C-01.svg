587.15" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="out" data-source-point="[8,20.7,5.5]"><title>out · output · face rear · local XYZ [8, 20.7, 5.5] м · schematic</title></rect><text x="165" y="585.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P2</text><rect x="157" y="622.4" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="power" data-source-point="[8,16,6]"><title>power · bidirectional · face unknown · local XYZ [8, 16, 6] м · schematic</title></rect><text x="165" y="620.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P3</text><polyline points="160,466.4 160,460.4 385,205.4" fill="none" stroke="#20282b" stroke-width="2" marker-end="url(#arrow)"><title>iron-home-COMMISSION-PLATE</title></polyline><line x1="160" y1="460.4" x2="686" y2="197.4" stroke="#465256" stroke-width="1.2" stroke-dasharray="2 3" /><rect x="689.5" y="186.4" width="39" height="22" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" /><text x="709" y="202.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#20282b">C02</text><text x="760" y="193.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">C02 ·</text><text x="760" y="213.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">iron-home-COMMISSION-P</text><text x="760" y="234.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">LATE</text><text x="760" y="254.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Desc_IronPlate_C</text><text x="760" y="274.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Уникальный физический</text><text x="760" y="295" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участок · 80 шт/мин</text><text x="760" y="315.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Z: 5.5 м</text><text x="760" y="347.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Iron Plate · всего 1</text><text x="760" y="367.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">линий; ≤ 750 на линию.</text><text x="760" y="398.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Все физические участки</text><text x="760" y="418.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">показаны один раз в</text><text x="760" y="438.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">проекции XY с</text><text x="760" y="459.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">отметками Z. Скорости</text><text x="760" y="479.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">последовательных</text><text x="760" y="499.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участков не</text><text x="760" y="520" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">суммировать. Машины</text><text x="760" y="540.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">относятся только к</text><text x="760" y="560.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">выбранному уровню.</text><text x="760" y="580.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Квадрат: вертикальный</text><text x="760" y="601.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участок; стрелки</text><text x="760" y="621.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">следуют points.</text><text x="760" y="641.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Пересечение линий не</text><text x="760" y="662.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означает соединение.</text><line x1="100" y1="781.4" x2="460" y2="781.4" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="750.4" x2="100" y2="786.4" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="785.4" x2="104" y2="777.4" stroke="#465256" stroke-width="1.2" /><line x1="460" y1="750.4" x2="460" y2="786.4" stroke="#465256" stroke-width="1.2" /><line x1="456" y1="785.4" x2="464" y2="777.4" stroke="#465256" stroke-width="1.2" /><text x="280" y="804.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">48 м · 6 модулей по 8 м</text><line x1="62" y1="205.4" x2="62" y2="745.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="205.4" x2="95" y2="205.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="209.4" x2="66" y2="201.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="745.4" x2="95" y2="745.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="749.4" x2="66" y2="741.4" stroke="#465256" stroke-width="1.2" /><text x="47" y="475.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 475.4)">72 м</text><text x="32" y="840.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты</text><text x="32" y="860.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">машин заданы по центру. Оранжевый контур: явный</text><text x="32" y="881" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт или footprint, не коллизия и не</text><text x="32" y="901.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровой меш. Штриховка: отдельная зона</text><text x="32" y="921.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница</text><text x="32" y="941.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания. Серые клетки: оплачиваемые плиты;</text><text x="32" y="962.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">тёплые клетки: первый пуск. Пустые клетки не</text><text x="32" y="982.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означают готовый пол.</text><line x1="60" y1="1032.8" x2="60" y2="1006.8" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="1022.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="1071.8" x2="1068" y2="1071.8" stroke="#465256" stroke-width="1.2" /><text x="32" y="1096.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1121.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1141.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1161.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
