" y="538.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"RAW", "toProjectId": "iron-home"}</text><text x="475" y="562.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">{"absoluteZStatus": "All relative Z uses a</text><text x="475" y="580.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">proposed common construction datum; source</text><text x="475" y="599.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">node absolute Z retained separately. Terrain</text><text x="475" y="618.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">and native connector reconciliation</text><text x="475" y="637.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">unknown.", "baseline": true, "buildPhaseId":</text><text x="475" y="656.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"plate-chain", "capacity": 750,</text><text x="475" y="675.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"coordinateSpace": "worldXY-relativeZ",</text><text x="475" y="694.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"itemId": "Desc_OreIron_C", "kind": "belt",</text><text x="475" y="712.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"operatingStates": ["first-plate", "steady"],</text><text x="475" y="731.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"ownerProjectId": "iron-home",