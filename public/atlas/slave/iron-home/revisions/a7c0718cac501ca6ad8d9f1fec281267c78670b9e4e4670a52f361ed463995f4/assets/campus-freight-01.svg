Vu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">BELT-SUPPORT-09: world [-1890.5, 2713.5],</text><text x="475" y="984.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">основание Z 4, верх стойки Z 9.5 м.</text><text x="475" y="1003.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">BELT-SUPPORT-10: world [-1900.075, 2748.15],</text><text x="475" y="1022.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">основание Z 0, верх стойки Z 9.5 м.</text><line x1="32" y1="1057.35" x2="1068" y2="1057.35" stroke="#465256" stroke-width="1.2" /><line x1="32" y1="1093.35" x2="1068" y2="1093.35" stroke="#465256" stroke-width="1.2" /><text x="32" y="1118.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1142.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1162.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1183.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
