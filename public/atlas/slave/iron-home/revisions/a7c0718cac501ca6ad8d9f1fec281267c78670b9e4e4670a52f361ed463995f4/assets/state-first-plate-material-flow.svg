<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1210" width="1100" height="1210"><title id="title">Направленные материальные потоки · соединения и группы</title><desc id="desc">Домашнее железо · first-plate · iron-home · ревизия d173a9198130a0c1c6c0b9d158b34d773d59db8139e47054a4569e26dda0bd61. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1210" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Направленные материальные потоки ·</text><text x="32" y="70.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">соединения и группы</text><text x="32" y="111.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Домашнее железо · first-plate · iron-home · ревизия</text><text x="32" y="131.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">d173a9198130a0c1c6c0b9d158b34d773d59db8139e47054a4569e26dda0bd61</text><line x1="32" y1="170.2" x2="1068" y2="170.2" stroke="#20282b" stroke-width="1.2" /><text x="32" y="194.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Каждая строка показывает направленное соединение, а не физическую трассу.</text><text x="32" y="214.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Несколько источников слева подают суммарный расход справа. Разделение</text><text x="32" y="234.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">между источниками не предполагается.</text><rect x="32" y="271.1" width="190" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="297.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">IngotIron</text><line x1="222" y1="321.1" x2="265" y2="321.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="285" y="295.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">S01 · first-plate-stream-0001</text><text x="285" y="315.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Iron Ingot</text><text x="285" y="335.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">120 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="321.1" x2="785" y2="321.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="271.1" width="268" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="297.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">IronPlate</text><rect x="32" y="395.1" width="190" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="421.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">IronPlate</text><line x1="222" y1="445.1" x2="265" y2="445.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="285" y="419.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">S02 · first-plate-stream-0002</text><text x="285" y="439.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Iron Plate</text><text x="285" y="459.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">80 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="445.1" x2="785" y2="445.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="395.1" width="268" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="421.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">STOCK</text><rect x="32" y="519.1" width="190" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="545.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">RAW</text><line x1="222" y1="569.1" x2="265" y2="569.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="285" y="543.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">S03 · first-plate-stream-0003</text><text x="285" y="563.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Iron Ore</text><text x="285" y="583.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">120 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="569.1" x2="785" y2="569.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="519.1" width="268" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="545.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">IngotIron</text><text x="32" y="651.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#20282b">Производственные группы и фактические размещения</text><text x="32" y="692.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">IngotIron · Iron Ingot · Плавильня</text><text x="32" y="712.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Расчёт: 1 машин; частота 80 %. Размещено: 1.</text><text x="32" y="732.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">ID: SM-01</text><text x="52" y="759" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вход группы: Iron Ore · 120 шт/мин</text><text x="52" y="779.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Валовой выход группы: Iron Ingot · 120 шт/мин</text><text x="32" y="817.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">IronPlate · Iron Plate · Конструктор</text><text x="32" y="837.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Расчёт: 1 машин; частота 80 %. Размещено: 1.</text><text x="32" y="858.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">ID: PL-01</text><text x="52" y="884.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вход группы: Iron Ingot · 120 шт/мин</text><text x="52" y="904.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Валовой выход группы: Iron Plate · 80 шт/мин</text><text x="32" y="943.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#20282b">Целевой нетто-выпуск из документа</text><text x="32" y="980.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Iron Plate · 80 шт/мин</text><text x="32" y="1008.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Цель не добавляет несуществующую выходную трассу. Вывоз и буфер требуют</text><text x="32" y="1028.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">собственного stream и layout.routes.</text><line x1="32" y1="1073" x2="1068" y2="1073" stroke="#465256" stroke-width="1.2" /><text x="32" y="1098" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1122.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1142.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1162.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
