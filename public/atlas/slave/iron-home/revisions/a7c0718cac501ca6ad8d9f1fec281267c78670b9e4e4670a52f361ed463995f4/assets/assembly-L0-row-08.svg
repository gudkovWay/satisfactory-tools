="#20282b">P2 · out · output · face</text><text x="760" y="492" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">rear · local XYZ [32,</text><text x="760" y="509.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">65.2, 5.5] м · schematic</text><text x="760" y="531.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">P3 · power ·</text><text x="760" y="549.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">bidirectional · face</text><text x="760" y="566.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">unknown · local XYZ [32,</text><text x="760" y="584" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">60, 6] м · schematic</text><line x1="100" y1="379.358333" x2="650" y2="379.358333" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="348.358333" x2="100" y2="384.358333" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="383.358333" x2="104" y2="375.358333" stroke="#465256" stroke-width="1.2" /><line x1="650" y1="348.358333" x2="650" y2="384.358333" stroke="#465256" stroke-width="1.2" /><line x1="646" y1="383.358333" x2="654" y2="375.358333" stroke="#465256" stroke-width="1.2" /><text x="375" y="402.358333" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">Площадка по X: 48 м</text><line x1="62" y1="194.4" x2="62" y2="343.358333" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="194.4" x2="95" y2="194.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="198.4" x2="66" y2="190.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="343.358333" x2="95" y2="343.358333" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="347.358333" x2="66" y2="339.358333" stroke="#465256" stroke-width="1.2" /><text x="47" y="268.879167" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 268.879167)">Z 0 … 13 м</text><text x="32" y="445.358333" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Это проекция только указанного ряда, не разрез</text><text x="32" y="465.658333" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровых мешей. Оранжевый контур задаёт явный</text><text x="32" y="485.958333" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт. Пунктир показывает явно заданную</text><text x="32" y="506.258333" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">высоту обслуживания. P: только исходные</text><text x="32" y="526.558333" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">schematic-порты; в XZ точки разных Y могут</text><text x="32" y="546.858333" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">совпадать. Толщина пола и опоры не придуманы.</text><line x1="32" y1="644.4" x2="1068" y2="644.4" stroke="#465256" stroke-width="1.2" /><text x="32" y="669.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="693.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="714" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="734.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
