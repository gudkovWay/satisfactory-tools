ont-size="12" text-anchor="start" font-weight="400" fill="#20282b">componentId: PowerPoleMk1</text><text x="760" y="374.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">processId: не задан</text><text x="760" y="400" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">P1 · power ·</text><text x="760" y="417.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">bidirectional · face</text><text x="760" y="434.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">unknown · local XYZ [14,</text><text x="760" y="452.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">42, 7] м · schematic</text><line x1="100" y1="322.066667" x2="650" y2="322.066667" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="291.066667" x2="100" y2="327.066667" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="326.066667" x2="104" y2="318.066667" stroke="#465256" stroke-width="1.2" /><line x1="650" y1="291.066667" x2="650" y2="327.066667" stroke="#465256" stroke-width="1.2" /><line x1="646" y1="326.066667" x2="654" y2="318.066667" stroke="#465256" stroke-width="1.2" /><text x="375" y="345.066667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">Площадка по X: 48 м</text><line x1="62" y1="194.4" x2="62" y2="286.066667" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="194.4" x2="95" y2="194.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="198.4" x2="66" y2="190.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="286.066667" x2="95" y2="286.066667" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="290.066667" x2="66" y2="282.066667" stroke="#465256" stroke-width="1.2" /><text x="47" y="240.233333" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 240.233333)">Z 0 … 8 м</text><text x="32" y="376.066667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Следующий уровень L0: Z 4 м; шаг отметок 4 м.</text><text x="32" y="396.366667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Максимальный верх этого ряда: Z 7 м.</text><text x="32" y="428.666667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Это проекция только указанного ряда, не разрез</text><text x="32" y="448.966667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровых мешей. Оранжевый контур задаёт явный</text><text x="32" y="469.266667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт. Пунктир показывает явно заданную</text><text x="32" y="489.566667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">высоту обслуживания. P: только исходные</text><text x="32" y="509.866667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">schematic-порты; в XZ точки разных Y могут</text><text x="32" y="530.166667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">совпадать. Толщина пола и опоры не придуманы.</text><line x1="32" y1="574.466667" x2="1068" y2="574.466667" stroke="#465256" stroke-width="1.2" /><text x="32" y="599.466667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="623.766667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="644.066667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="664.366667" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
