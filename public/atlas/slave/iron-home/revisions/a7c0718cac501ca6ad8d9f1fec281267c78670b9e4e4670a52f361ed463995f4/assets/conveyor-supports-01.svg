<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1338" width="1100" height="1338"><title id="title">Опоры конвейеров · ведомость монтажа · 1/1</title><desc id="desc">Домашнее железо · iron-home · ревизия d173a9198130a0c1c6c0b9d158b34d773d59db8139e47054a4569e26dda0bd61. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1338" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Опоры конвейеров · ведомость монтажа · 1/1</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Домашнее железо · iron-home · ревизия</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">d173a9198130a0c1c6c0b9d158b34d773d59db8139e47054a4569e26dda0bd61</text><line x1="32" y1="135.4" x2="1068" y2="135.4" stroke="#20282b" stroke-width="1.2" /><text x="32" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Опоры оплачены отдельно от лент и электростолбов. В основной ведомости</text><text x="32" y="179.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">сохранены и закупленные пусковые опоры: неактивные в выбранном режиме не</text><text x="32" y="200" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">считать установленными в готовом ядре. Демонтаж не даёт зачтённого</text><text x="32" y="220.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">возврата. Высота регулируемой стойки и её крепление требуют проверки в</text><text x="32" y="240.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игре.</text><text x="32" y="276.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-01 · Активная опора выбранного режима</text><text x="32" y="307.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 8; Y 70; основание Z 0 м; world XY -1886, 2774 м. Верх стойки:</text><text x="32" y="327.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не указан. Связи:</text><text x="32" y="348.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">interface-STOCK-PLATE.</text><line x1="32" y1="380.45" x2="1068" y2="380.45" stroke="#465256" stroke-width="1.2" /><text x="32" y="398.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-02 · Активная опора выбранного режима</text><text x="32" y="429.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 24; Y 70; основание Z 4 м; world XY -1870, 2774 м. Верх стойки:</text><text x="32" y="449.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не указан. Связи:</text><text x="32" y="469.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">interface-STOCK-ROD.</text><line x1="32" y1="502" x2="1068" y2="502" stroke="#465256" stroke-width="1.2" /><text x="32" y="520" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-03 · Активная опора выбранного режима</text><text x="32" y="550.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 32; Y 70; основание Z 4 м; world XY -1862, 2774 м. Верх стойки:</text><text x="32" y="570.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не указан. Связи:</text><text x="32" y="591.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">interface-STOCK-SCREW.</text><line x1="32" y1="623.55" x2="1068" y2="623.55" stroke="#465256" stroke-width="1.2" /><text x="32" y="641.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-04 · Не входит в активную геометрию выбранного</text><text x="32" y="666.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">режима</text><text x="32" y="696.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 8; Y 9.5; основание Z 4 м; world XY -1886, 2713.5 м. Верх</text><text x="32" y="717.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: plate-chain; демонтаж:</text><text x="32" y="737.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">finish-core. Связи: iron-home-COMMISSION-DIRECT.</text><line x1="32" y1="769.75" x2="1068" y2="769.75" stroke="#465256" stroke-width="1.2" /><text x="32" y="787.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-08 · Не входит в активную геометрию выбранного</text><text x="32" y="812.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">режима</text><text x="32" y="843.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 23; Y 55; основание Z 0 м; world XY -1871, 2759 м. Верх стойки:</text><text x="32" y="863.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Z 5.5 м; пятно 1 × 2 м. Монтаж: plate-chain; демонтаж: finish-core. Связи:</text><text x="32" y="883.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">iron-home-COMMISSION-PLATE.</text><line x1="32" y1="915.95" x2="1068" y2="915.95" stroke="#465256" stroke-width="1.2" /><text x="32" y="933.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-09 · Активная опора выбранного режима</text><text x="32" y="964.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 3.5; Y 9.5; основание Z 4 м; world XY -1890.5, 2713.5 м. Верх</text><text x="32" y="984.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 9.5 м; пятно 1 × 2 м. Монтаж: plate-chain; демонтаж: не указан.</text><text x="32" y="1005.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Связи: iron-home-RAW-WORLD.</text><line x1="32" y1="1037.5" x2="1068" y2="1037.5" stroke="#465256" stroke-width="1.2" /><text x="32" y="1055.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-10 · Активная опора выбранного режима</text><text x="32" y="1086.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -6.075; Y 44.15; основание Z 0 м; world XY -1900.075, 2748.15</text><text x="32" y="1106.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">м. Верх стойки: Z 9.5 м; пятно 1 × 2 м. Монтаж: plate-chain; демонтаж: не</text><text x="32" y="1126.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: iron-home-RAW-WORLD.</text><line x1="32" y1="1159.05" x2="1068" y2="1159.05" stroke="#465256" stroke-width="1.2" /><line x1="32" y1="1201.05" x2="1068" y2="1201.05" stroke="#465256" stroke-width="1.2" /><text x="32" y="1226.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1250.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1270.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1290.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
