art" font-weight="400" fill="#20282b">показаны один раз в</text><text x="760" y="469.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">проекции XY с</text><text x="760" y="489.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">отметками Z. Скорости</text><text x="760" y="509.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">последовательных</text><text x="760" y="530" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участков не</text><text x="760" y="550.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">суммировать. Машины</text><text x="760" y="570.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">относятся только к</text><text x="760" y="590.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">выбранному уровню.</text><text x="760" y="611.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Квадрат: вертикальный</text><text x="760" y="631.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участок; стрелки</text><text x="760" y="651.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">следуют points.</text><text x="760" y="672.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Пересечение линий не</text><text x="760" y="692.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означает соединение.</text><line x1="100" y1="781.4" x2="580" y2="781.4" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="750.4" x2="100" y2="786.4" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="785.4" x2="104" y2="777.4" stroke="#465256" stroke-width="1.2" /><line x1="580" y1="750.4" x2="580" y2="786.4" stroke="#465256" stroke-width="1.2" /><line x1="576" y1="785.4" x2="584" y2="777.4" stroke="#465256" stroke-width="1.2" /><text x="340" y="804.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">64 м · 8 модулей по 8 м</text><line x1="62" y1="205.4" x2="62" y2="745.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="205.4" x2="95" y2="205.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="209.4" x2="66" y2="201.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="745.4" x2="95" y2="745.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="749.4" x2="66" y2="741.4" stroke="#465256" stroke-width="1.2" /><text x="47" y="475.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 475.4)">72 м</text><text x="32" y="840.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты</text><text x="32" y="860.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">машин заданы по центру. Оранжевый контур: явный</text><text x="32" y="881" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт или footprint, не коллизия и не</text><text x="32" y="901.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровой меш. Штриховка: отдельная зона</text><text x="32" y="921.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница</text><text x="32" y="941.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания. Серые клетки: оплачиваемые плиты;</text><text x="32" y="962.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">тёплые клетки: первый пуск. Пустые клетки не</text><text x="32" y="982.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означают готовый пол.</text><line x1="60" y1="1032.8" x2="60" y2="1006.8" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="1022.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="1071.8" x2="1068" y2="1071.8" stroke="#465256" stroke-width="1.2" /><text x="32" y="1096.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1121.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1141.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1161.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
