e</text><text x="285" y="831.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">120 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="817.1" x2="785" y2="817.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="767.1" width="268" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="793.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">Cable</text><rect x="32" y="891.1" width="190" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="917.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">Wire</text><line x1="222" y1="941.1" x2="265" y2="941.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="285" y="915.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">S06 · steady-stream-0006</text><text x="285" y="935.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Wire</text><text x="285" y="955.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">120 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="941.1" x2="785" y2="941.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="891.1" width="268" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="917.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">STOCK</text><text x="32" y="1023.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#20282b">Производственные группы и фактические размещения</text><text x="32" y="1064.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Cable · Cable · Конструктор</text><text x="32" y="1084.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Расчёт: 1 машин; частота 40 %. Размещено: 1.</text><text x="32" y="1104.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">ID: CB-01</text><text x="52" y="1131" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вход группы: Wire · 120 шт/мин</text><text x="52" y="1151.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Валовой выход группы: Cable · 60 шт/мин</text><text x="32" y="1189.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">IngotCopper · Copper Ingot · Плавильня</text><text x="32" y="1209.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Расчёт: 1 машин; частота 80 %. Размещено: 1.</text><text x="32" y="1230.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">ID: SM-01</text><text x="52" y="1256.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вход группы: Copper Ore · 120 шт/мин</text><text x="52" y="1276.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Валовой выход группы: Copper Ingot · 120 шт/мин</text><text x="32" y="1315.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Wire · Wire · Конструктор</text><text x="32" y="1335.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Расчёт: 2 машин; частота 80 %. Размещено: 2.</text><text x="32" y="1355.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">ID: WR-01, WR-02</text><text x="52" y="1382" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вход группы: Copper Ingot · 120 шт/мин</text><text x="52" y="1402.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Валовой выход группы: Wire · 240 шт/мин</text><text x="32" y="1440.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#20282b">Целевой нетто-выпуск из документа</text><text x="32" y="1477.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Cable · 60 шт/мин</text><text x="32" y="1497.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Wire · 120 шт/мин</text><text x="32" y="1526.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Цель не добавляет несуществующую выходную трассу. Вывоз и буфер требуют</text><text x="32" y="1546.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">собственного stream и layout.routes.</text><line x1="32" y1="1590.8" x2="1068" y2="1590.8" stroke="#465256" stroke-width="1.2" /><text x="32" y="1615.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1640.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1660.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1680.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
