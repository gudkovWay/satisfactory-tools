<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1727" width="1100" height="1727"><title id="title">Направленные материальные потоки · соединения и группы</title><desc id="desc">Ранняя медь · copper-home · ревизия c91c6e22ca72110a0164e2f862176ab98c869f28d67dacce28781d4f90d25606. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1727" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Направленные материальные потоки ·</text><text x="32" y="70.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">соединения и группы</text><text x="32" y="111.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Ранняя медь · copper-home · ревизия</text><text x="32" y="131.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">c91c6e22ca72110a0164e2f862176ab98c869f28d67dacce28781d4f90d25606</text><line x1="32" y1="170.2" x2="1068" y2="170.2" stroke="#20282b" stroke-width="1.2" /><text x="32" y="194.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Каждая строка показывает направленное соединение, а не физическую трассу.</text><text x="32" y="214.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Несколько источников слева подают суммарный расход справа. Разделение</text><text x="32" y="234.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">между источниками не предполагается.</text><rect x="32" y="271.1" width="190" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="297.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">Cable</text><line x1="222" y1="321.1" x2="265" y2="321.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="285" y="295.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">S01 · steady-stream-0001</text><text x="285" y="315.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Cable</text><text x="285" y="335.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">60 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="321.1" x2="785" y2="321.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="271.1" width="268" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="297.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">STOCK</text><rect x="32" y="395.1" width="190" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="421.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">IngotCopper</text><line x1="222" y1="445.1" x2="265" y2="445.1" stroke="#465256"