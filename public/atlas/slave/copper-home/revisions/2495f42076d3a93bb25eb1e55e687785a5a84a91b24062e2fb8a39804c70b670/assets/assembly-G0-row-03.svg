<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 688" width="1100" height="688"><title id="title">Сборочная проекция XZ · G0 · ряд Y = 62 м</title><desc id="desc">Ранняя медь · copper-home · ревизия c91c6e22ca72110a0164e2f862176ab98c869f28d67dacce28781d4f90d25606. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="688" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Сборочная проекция XZ · G0 · ряд Y = 62 м</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Ранняя медь · copper-home · ревизия</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">c91c6e22ca72110a0164e2f862176ab98c869f28d67dacce28781d4f90d25606</text><line x1="32" y1="135.4" x2="1068" y2="135.4" stroke="#20282b" stroke-width="1.2" /><line x1="100" y1="263.15" x2="650" y2="263.15" stroke="#20282b" stroke-width="1.2" /><text x="100" y="287.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">Отметка уровня G0 · Z 0 м, не доказательство пола</text><text x="760" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">Ведомость сборки</text><text x="760" y="185.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">ряда (не порядок</text><text x="760" y="211.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">монтажа)</text><rect x="353.515625" y="202.99375" width="8.59375" height="60.15625" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><rect x="344.921875" y="194.4" width="25.78125" height="68.75" fill="none" stroke="#20282b" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="354.8125" y="199.99375" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="power" data-source-point="[30,62,7]"><title>power · bidirectional · face unknown · local XYZ [30, 62, 7] м · schematic</title></rect><text x="362.8125" y="197.99375" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P1</text><text x="760" y="247.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">1. M04 · POLE-03</text><text x="760" y="268" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">pole</text><text x="760" y="288.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Основание Z 0; верх Z</text><text x="760" y="308.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">7 м; высота 7 м.</text><text x="760" y="328.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">rotationDeg: 0</text><text x="760" y="357.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">componentId: PowerPoleMk1</text><text x="760" y="374.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">processId: не задан</text><text x="760" y="400" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">P1 · power ·</text><text x="760" y="417.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">bidirectional · face</text><text x="760" y="434.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">unknown · local XYZ [30,</text><text x="760" y="452.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">62, 7] м · schematic</text><line x1="100" y1="299.15" x2="650" y2="299.15" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="268.15" x2="100" y2="304.15" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="303.15" x2="104" y2="295.15" stroke="#465256" stroke-width="1.2" /><line x1="650" y1="268.15" x2="650" y2="304.15" stroke="#465256" stroke-width="1.2" /><line x1="646" y1="303.15" x2="654" y2="295.15" stroke="#465256" stroke-width="1.2" /><text x="375" y="322.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">Площадка по X: 64 м</text><line x1="62" y1="194.4" x2="62" y2="263.15" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="194.4" x2="95" y2="194.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="198.4" x2="66" y2="190.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="263.15" x2="95" y2="263.15" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="267.15" x2="66" y2="259.15" stroke="#465256" stroke-width="1.2" /><text x="47" y="228.775" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 228.775)">Z 0 … 8 м</text><text x="32" y="353.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Следующий уровень L0: Z 4 м; шаг отметок 4 м.</text><text x="32" y="373.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Максимальный верх этого ряда: Z 7 м.</text><text x="32" y="405.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Это проекция только указанного ряда, не разрез</text><text x="32" y="426.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровых мешей. Оранжевый контур задаёт явный</text><text x="32" y="446.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт. Пунктир показывает явно заданную</text><text x="32" y="466.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">высоту обслуживания. P: только исходные</text><text x="32" y="486.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">schematic-порты; в XZ точки разных Y могут</text><text x="32" y="507.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">совпадать. Толщина пола и опоры не придуманы.</text><line x1="32" y1="551.55" x2="1068" y2="551.55" stroke="#465256" stroke-width="1.2" /><text x="32" y="576.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="600.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="621.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="641.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
