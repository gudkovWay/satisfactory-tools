" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">M04 ·</text><text x="1020" y="249.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">POLE-01</text><text x="1162" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">pole</text><text x="1312" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">1 / 28</text><text x="1407" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1462" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1538" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1648" y="232" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">1×1×7</text><line x1="1020" y1="270.8" x2="1768" y2="270.8" stroke="#c5cbc8" stroke-width="1.2" /><rect x="506" y="332.1" width="42" height="42" fill="url(#clearance)" stroke="#20282b" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="520" y="346.1" width="14" height="14" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="527" y="356.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" font-weight="400" fill="#20282b">05</text><rect x="524" y="350.1" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="power" data-source-point="[30,28,7]"><title>power · bidirectional · face unknown · local XYZ [30, 28, 7] м · schematic</title></rect><text x="532" y="348.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P1</text><text x="1020" y="290.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">M05 ·</text><text x="1020" y="308.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">POLE-02</text><text x="1162" y="290.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">pole</text><text x="1312" y="290.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">30 / 28</text><text x="1407" y="290.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1462" y="290.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1538" y="290.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">0</text><text x="1648" y="290.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#20282b">1×1×7</text><line x1="1020" y1="329.6" x2="1768" y2="329.6" stroke="#c5cbc8" stroke-width="1.2" /><text x="1020" y="357.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">Координаты XY: центры; Z: основание. Конверт осевой,</text><text x="1020" y="376.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">повторно не поворачивается. Частота в этой таблице</text><text x="1020" y="395.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">округлена до 0.001%; точное исходное значение сохранено в</text><text x="1020" y="414.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">документе. Поворот: rotationDeg в осях проекта, не</text><text x="1020" y="433" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">подтверждение native yaw. unknown: rotationDeg не задан;</text><text x="1020" y="451.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">направление не предполагается. Полные порты P,</text><text x="1020" y="470.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">componentId и processId: сборочные листы этого уровня по</text><text x="1020" y="489.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">точному ряду Y; выберите то же состояние. Отсутствующие</text><text x="1020" y="508.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">поля и аннотации: лист ограничений выпуска.</text><text x="1020" y="543.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">R01 · FRONT-8M</text><text x="1020" y="562.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">48 × 8 м; X 0; Y 0</text><text x="1020" y="590.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">R02 · SIDE-8M</text><text x="1020" y="609.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">8 × 40 м; X 48; Y 0</text><line x1="107" y1="781.1" x2="891" y2="781.1" stroke="#465256" stroke-width="1.2" /><line x1="107" y1="750.1" x2="107" y2="786.1" stroke="#465256" stroke-width="1.2" /><line x1="103" y1="785.1" x2="111" y2="777.1" stroke="#465256" stroke-width="1.2" /><line x1="891" y1="750.1" x2="891" y2="786.1" stroke="#465256" stroke-width="1.2" /><line x1="887" y1="785.1" x2="895" y2="777.1" stroke="#465256" stroke-width="1.2" /><text x="499" y="804.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">56 м · 7 модулей по 8 м</text><line x1="69" y1="185.1" x2="69" y2="745.1" stroke="#465256" stroke-width="1.2" /><line x1="64" y1="185.1" x2="102" y2="185.1" stroke="#465256" stroke-width="1.2" /><line x1="65" y1="189.1" x2="73" y2="181.1" stroke="#465256" stroke-width="1.2" /><line x1="64" y1="745.1" x2="102" y2="745.1" stroke="#465256" stroke-width="1.2" /><line x1="65" y1="749.1" x2="73" y2="741.1" stroke="#465256" stroke-width="1.2" /><text x="54" y="465.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 54 465.1)">40 м</text><text x="32" y="840.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты машин заданы по</text><text x="32" y="860.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">центру. Оранжевый контур: явный осевой конверт или footprint, не</text><text x="32" y="880.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">коллизия и не игровой меш. Штриховка: отдельная зона</text><text x="32" y="901" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница обслуживания. Серые</text><text x="32" y="921.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки: оплачиваемые плиты; тёплые клетки: первый пуск. Пустые</text><text x="32" y="941.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки не означают готовый пол.</text><line x1="60" y1="991.9" x2="60" y2="965.9" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="981.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="1030.9" x2="1768" y2="1030.9" stroke="#465256" stroke-width="1.2" /><text x="32" y="1055.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1080.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы и грани электрических якорей не проверены.</text><text x="32" y="1100.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Контейнерам питание не требуется.</text></svg>
