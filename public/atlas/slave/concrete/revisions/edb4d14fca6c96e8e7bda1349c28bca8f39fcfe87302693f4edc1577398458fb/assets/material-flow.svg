1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">Concrete</text><rect x="32" y="643.1" width="190" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="47" y="669.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">RAW</text><line x1="222" y1="693.1" x2="265" y2="693.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="285" y="667.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">S04 · steady-stream-0004</text><text x="285" y="687.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Limestone</text><text x="285" y="707.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">120 шт/мин · 1 линий × ≤ 750</text><line x1="733" y1="693.1" x2="785" y2="693.1" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><rect x="800" y="643.1" width="268" height="100" fill="#f0f1ec" stroke="#20282b" stroke-width="1.2" /><text x="818" y="669.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#20282b">Concrete</text><text x="32" y="775.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#20282b">Производственные группы и фактические размещения</text><text x="32" y="816.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Concrete · Concrete · Конструктор</text><text x="32" y="836.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Расчёт: 2 машин; частота 53.333333 %. Размещено: 2.</text><text x="32" y="856.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">ID: CC-01, CC-02</text><text x="52" y="883" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вход группы: Limestone · 240 шт/мин</text><text x="52" y="903.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Валовой выход группы: Concrete · 80 шт/мин</text><text x="32" y="941.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700" fill="#20282b">Целевой нетто-выпуск из документа</text><text x="32" y="978.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Concrete · 80 шт/мин</text><text x="32" y="1006.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Цель не добавляет несуществующую выходную трассу. Вывоз и буфер требуют</text><text x="32" y="1027.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">собственного stream и layout.routes.</text><line x1="32" y1="1071.5" x2="1068" y2="1071.5" stroke="#465256" stroke-width="1.2" /><text x="32" y="1096.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1120.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1141.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1161.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
