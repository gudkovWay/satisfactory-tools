ddle" font-weight="400" fill="#20282b">Площадка по X: 56 м</text><line x1="66.867257" y1="194.4" x2="66.867257" y2="272.276106" stroke="#465256" stroke-width="1.2" /><line x1="61.867257" y1="194.4" x2="99.867257" y2="194.4" stroke="#465256" stroke-width="1.2" /><line x1="62.867257" y1="198.4" x2="70.867257" y2="190.4" stroke="#465256" stroke-width="1.2" /><line x1="61.867257" y1="272.276106" x2="99.867257" y2="272.276106" stroke="#465256" stroke-width="1.2" /><line x1="62.867257" y1="276.276106" x2="70.867257" y2="268.276106" stroke="#465256" stroke-width="1.2" /><text x="51.867257" y="233.338053" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 51.867257 233.338053)">Z 0 … 8 м</text><text x="32" y="362.276106" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Следующий уровень L0: Z 4 м; шаг отметок 4 м.</text><text x="32" y="382.576106" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Максимальный верх этого ряда: Z 7 м.</text><text x="32" y="414.876106" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Это проекция только указанного ряда, не разрез</text><text x="32" y="435.176106" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровых мешей. Оранжевый контур задаёт явный</text><text x="32" y="455.476106" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт. Пунктир показывает явно заданную</text><text x="32" y="475.776106" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">высоту обслуживания. P: только исходные</text><text x="32" y="496.076106" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">schematic-порты; в XZ точки разных Y могут</text><text x="32" y="516.376106" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">совпадать. Толщина пола и опоры не придуманы.</text><line x1="32" y1="753.5" x2="1068" y2="753.5" stroke="#465256" stroke-width="1.2" /><text x="32" y="778.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="802.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="823.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="843.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
