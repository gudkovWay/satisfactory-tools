<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1268" width="1100" height="1268"><title id="title">Кампус · грузовые связи · steady · лист 1</title><desc id="desc">Бетон для строительства · concrete · ревизия d6831556a7f48fb86e9277480da5d30a227912f896938128a7218624d907c5a1. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1268" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Кампус · грузовые связи · steady · лист 1</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Бетон для строительства · concrete · ревизия</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">d6831556a7f48fb86e9277480da5d30a227912f896938128a7218624d907c5a1</text><line x1="32" y1="135.4" x2="1068" y2="135.4" stroke="#20282b" stroke-width="1.2" /><text x="32" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Каждая связь принадлежит только ownerProjectId и показана один раз в</text><text x="32" y="179.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">комплекте указанного состояния. Геометрия: pointsWorldXYRelativeZ, метры;</text><text x="32" y="200" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">X вправо, +Y вверх. Это НЕ локальные координаты площадки. Z: общий</text><text x="32" y="220.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">предложенный относительный datum, абсолютная высота и рельеф неизвестны.</text><text x="32" y="240.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Квадраты обозначают исходные вершины; совпадение XY не отменяет</text><text x="32" y="260.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">вертикальный участок. Пересечение линий не означает соединение. Питание не</text><text x="32" y="281.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">задаёт направление потока или вымышленный расход MW.</text><text x="32" y="313.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">Преобразование локальных XY проекта в world XY (только из источника):</text><text x="32" y="332.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">{"absoluteFloorZ": "unknown", "gamePortTransforms": "unknown", "placementXY":</text><text x="32" y="351.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"centres", "xyOrigin_m": [-1723.0, 2715.0]}</text><text x="32" y="386.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">concrete-RAW-WORLD</text><polyline points="55,539.506501 5