256" stroke-width="1.2" /><line x1="100" y1="327.078571" x2="100" y2="363.078571" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="362.078571" x2="104" y2="354.078571" stroke="#465256" stroke-width="1.2" /><line x1="650" y1="327.078571" x2="650" y2="363.078571" stroke="#465256" stroke-width="1.2" /><line x1="646" y1="362.078571" x2="654" y2="354.078571" stroke="#465256" stroke-width="1.2" /><text x="375" y="381.078571" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">Площадка по X: 56 м</text><line x1="62" y1="194.4" x2="62" y2="322.078571" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="194.4" x2="95" y2="194.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="198.4" x2="66" y2="190.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="322.078571" x2="95" y2="322.078571" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="326.078571" x2="66" y2="318.078571" stroke="#465256" stroke-width="1.2" /><text x="47" y="258.239286" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 258.239286)">Z 0 … 13 м</text><text x="32" y="424.078571" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Это проекция только указанного ряда, не разрез</text><text x="32" y="444.378571" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровых мешей. Оранжевый контур задаёт явный</text><text x="32" y="464.678571" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт. Пунктир показывает явно заданную</text><text x="32" y="484.978571" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">высоту обслуживания. P: только исходные</text><text x="32" y="505.278571" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">schematic-порты; в XZ точки разных Y могут</text><text x="32" y="525.578571" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">совпадать. Толщина пола и опоры не придуманы.</text><line x1="32" y1="1057.7" x2="1068" y2="1057.7" stroke="#465256" stroke-width="1.2" /><text x="32" y="1082.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1107" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1127.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1147.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
