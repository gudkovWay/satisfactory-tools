<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 924" width="1100" height="924"><title id="title">Опоры конвейеров · ведомость монтажа · 1/1</title><desc id="desc">Бетон для строительства · concrete · ревизия d6831556a7f48fb86e9277480da5d30a227912f896938128a7218624d907c5a1. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="924" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Опоры конвейеров · ведомость монтажа · 1/1</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Бетон для строительства · concrete · ревизия</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">d6831556a7f48fb86e9277480da5d30a227912f896938128a7218624d907c5a1</text><line x1="32" y1="135.4" x2="1068" y2="135.4" stroke="#20282b" stroke-width="1.2" /><text x="32" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Опоры оплачены отдельно от лент и электростолбов. В основной ведомости</text><text x="32" y="179.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">сохранены и закупленные пусковые опоры: неактивные в выбранном режиме не</text><text x="32" y="200" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">считать установленными в готовом ядре. Демонтаж не даёт зачтённого</text><text x="32" y="220.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">возврата. Высота регулируемой стойки и её крепление требуют проверки в</text><text x="32" y="240.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игре.</text><text x="32" y="276.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-01 · Активная опора выбранного режима</text><text x="32" y="307.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 16; Y 38; основание Z 0 м; world XY -1707, 2753 м. Верх стойки:</text><text x="32" y="327.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Z 5.5 м; пятно 1 × 2 м. Монтаж: concrete-chain; демонтаж: не указан.</text><text x="32" y="348.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Связи: interface-STOCK-CONCRETE.</text><line x1="32" y1="380.45" x2="1068" y2="380.45" stroke="#465256" stroke-width="1.2" /><text x="32" y="398.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-02 · Активная опора выбранного режима</text><text x="32" y="429.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -7; Y 14.69; основание Z 0 м; world XY -1730, 2729.69 м. Верх</text><text x="32" y="449.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 9.5 м; пятно 1 × 2 м. Монтаж: concrete-chain; демонтаж: не</text><text x="32" y="469.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: concrete-RAW-WORLD.</text><line x1="32" y1="502" x2="1068" y2="502" stroke="#465256" stroke-width="1.2" /><text x="32" y="520" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-03 · Активная опора выбранного режима</text><text x="32" y="550.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -7; Y 9.5; основание Z 0 м; world XY -1730, 2724.5 м. Верх</text><text x="32" y="570.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 9.5 м; пятно 1 × 2 м. Монтаж: concrete-chain; демонтаж: не</text><text x="32" y="591.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: concrete-RAW-WORLD.</text><line x1="32" y1="623.55" x2="1068" y2="623.55" stroke="#465256" stroke-width="1.2" /><text x="32" y="641.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-04 · Активная опора выбранного режима</text><text x="32" y="672.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -41.6; Y 14.69; основание Z 0 м; world XY -1764.6, 2729.69 м.</text><text x="32" y="692.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Верх стойки: Z 9.5 м; пятно 1 × 2 м. Монтаж: concrete-chain; демонтаж: не</text><text x="32" y="712.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: concrete-RAW-WORLD.</text><line x1="32" y1="745.1" x2="1068" y2="745.1" stroke="#465256" stroke-width="1.2" /><line x1="32" y1="787.1" x2="1068" y2="787.1" stroke="#465256" stroke-width="1.2" /><text x="32" y="812.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="836.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="856.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="877" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
