st, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X9</text><line x1="650" y1="535.4" x2="650" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="650" y="195.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#20282b">X10</text><line x1="100" y1="535.4" x2="650" y2="535.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="539.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y0</text><line x1="100" y1="480.4" x2="650" y2="480.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="484.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y1</text><line x1="100" y1="425.4" x2="650" y2="425.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="429.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y2</text><line x1="100" y1="370.4" x2="650" y2="370.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="374.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y3</text><line x1="100" y1="315.4" x2="650" y2="315.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="319.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y4</text><line x1="100" y1="260.4" x2="650" y2="260.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="264.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y5</text><line x1="100" y1="205.4" x2="650" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="91" y="209.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="end" font-weight="400" fill="#20282b">Y6</text><text x="760" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#20282b">Ведомость трасс</text><rect x="440.3125" y="384.15" width="48.125" height="82.5" fill="url(#clearance)" stroke="#20282b" stroke-width="1.2" stroke-dasharray="4 3" /><rect x="447.1875" y="391.025" width="34.375" height="68.75" fill="#f3dfce" stroke="#9b3b10" stroke-width="1.2" /><text x="464.375" y="428.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="middle" font-weight="400" fill="#20282b">01</text><rect x="461.375" y="458.15" width="6" height="6" fill="#faf9f5" stroke="#9b3b10" stroke-width="1.2" data-port-id="in" data-source-point="[53,10.8,1.5]"><title>in · input · face front · local XYZ [53, 10.8, 1.5] м · schematic</title></rect><text x="469.375" y="456.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#9b3b10">P1</text><rect x="461.375" y="386.65" width="6" height="6" fill="#faf9f5" stroke="#20282b" stroke-width="1.2" data-port-id="out" data-source-point="[53,21.2,1.5]"><title>out · output · face rear · local XYZ [53, 21.2, 1.5] м · schematic</title></rect><text x="469.375" y="384.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="10" text-anchor="start" font-weight="400" fill="#20282b">P2</text><text x="760" y="193.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Геометрия трасс</text><text x="760" y="213.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">отсутствует. Нужны</text><text x="760" y="234.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">layout.routes: id,</text><text x="760" y="254.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">kind, streamId, lane,</text><text x="760" y="274.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">rate, points</text><text x="760" y="295" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">[[x,y,z],...].</text><text x="760" y="315.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Вымышленные ленты не</text><text x="760" y="335.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">показаны.</text><text x="760" y="367.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Все физические участки</text><text x="760" y="388.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">показаны один раз в</text><text x="760" y="408.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">проекции XY с</text><text x="760" y="428.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">отметками Z. Скорости</text><text x="760" y="449.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">последовательных</text><text x="760" y="469.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участков не</text><text x="760" y="489.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">суммировать. Машины</text><text x="760" y="510" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">относятся только к</text><text x="760" y="530.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">выбранному уровню.</text><text x="760" y="550.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Квадрат: вертикальный</text><text x="760" y="570.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">участок; стрелки</text><text x="760" y="591.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">следуют points.</text><text x="760" y="611.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Пересечение линий не</text><text x="760" y="631.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означает соединение.</text><line x1="100" y1="571.4" x2="650" y2="571.4" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="540.4" x2="100" y2="576.4" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="575.4" x2="104" y2="567.4" stroke="#465256" stroke-width="1.2" /><line x1="650" y1="540.4" x2="650" y2="576.4" stroke="#465256" stroke-width="1.2" /><line x1="646" y1="575.4" x2="654" y2="567.4" stroke="#465256" stroke-width="1.2" /><text x="375" y="594.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">80 м · 10 модулей по 8 м</text><line x1="62" y1="205.4" x2="62" y2="535.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="205.4" x2="95" y2="205.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="209.4" x2="66" y2="201.4" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="535.4" x2="95" y2="535.4" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="539.4" x2="66" y2="531.4" stroke="#465256" stroke-width="1.2" /><text x="47" y="370.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 370.4)">48 м</text><text x="32" y="630.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты</text><text x="32" y="650.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">машин заданы по центру. Оранжевый контур: явный</text><text x="32" y="671" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">осевой конверт или footprint, не коллизия и не</text><text x="32" y="691.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игровой меш. Штриховка: отдельная зона</text><text x="32" y="711.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница</text><text x="32" y="731.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания. Серые клетки: оплачиваемые плиты;</text><text x="32" y="752.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">тёплые клетки: первый пуск. Пустые клетки не</text><text x="32" y="772.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">означают готовый пол.</text><line x1="60" y1="822.8" x2="60" y2="796.8" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="812.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="861.8" x2="1068" y2="861.8" stroke="#465256" stroke-width="1.2" /><text x="32" y="886.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="911.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="931.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="951.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
