<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 998" width="1100" height="998"><title id="title">Логистика · G0 · Z = 0 м</title><desc id="desc">Адресный склад · concrete-only · warehouse · ревизия 6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="998" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Логистика · G0 · Z = 0 м</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Адресный склад · concrete-only · warehouse · ревизия</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb</text><line x1="32" y1="135.4" x2="1068" y2="135.4" stroke="#20282b" stroke-width="1.2" /><rect x="100" y="205.4" width="550" height="330" fill="none" stroke="#20282b" stroke-width="1.2" /><line x1="100" y1="535.4" x2="100" y2="205.4" stroke="#c5cbc8" stroke-width="1.2" /><text x="100" y="195.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" font-weight="4