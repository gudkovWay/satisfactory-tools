<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1321" width="1100" height="1321"><title id="title">Кампус · грузовые связи · concrete-only · лист 1</title><desc id="desc">Адресный склад · concrete-only · warehouse · ревизия 6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1321" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Кампус · грузовые связи · concrete-only ·</text><text x="32" y="70.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">лист 1</text><text x="32" y="111.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Адресный склад · concrete-only · warehouse · ревизия</text><text x="32" y="131.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb</text><line x1="32" y1="170.2" x2="1068" y2="170.2" stroke="#20282b" stroke-width="1.2" /><text x="32" y="194.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Каждая связь принадлежит только ownerProjectId и показана один раз в</text><text x="32" y="214.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">комплекте указанного состояния. Геометрия: pointsWorldXYRelativeZ, метры;</text><text x="32" y="234.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">X вправо, +Y вверх. Это НЕ локальные координаты площадки. Z: общий</text><text x="32" y="255.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">предложенный относительный datum, абсолютная высота и рельеф неизвестны.</text><text x="32" y="275.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Квадраты обозначают исходные вершины; совпадение XY не отменяет</text><text x="32" y="295.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">вертикальный участок. Пересечение линий не означает соединение. Питание не</text><text x="32" y="316" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">задаёт направление потока или вымышленный расход MW.</text><text x="32" y="348.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">Преобразование локальных XY проекта в world XY (только из источника):</text><text x="32" y="367.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">{"absoluteFloorZ": "unknown; schematic common construction datum",</text><text x="32" y="386" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"gamePortTransforms": "unknown", "placementXY": "centres", "xyOrigin_m":</text><text 