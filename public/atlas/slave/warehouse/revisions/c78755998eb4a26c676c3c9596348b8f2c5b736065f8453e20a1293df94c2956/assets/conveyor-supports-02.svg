<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1435" width="1100" height="1435"><title id="title">Опоры конвейеров · ведомость монтажа · 2/3</title><desc id="desc">Адресный склад · warehouse · ревизия 6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1435" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Опоры конвейеров · ведомость монтажа · 2/3</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Адресный склад · warehouse · ревизия</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb</text><line x1="32" y1="135.4" x2="1068" y2="135.4" stroke="#20282b" stroke-width="1.2" /><text x="32" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Опоры оплачены отдельно от лент и электростолбов. В основной ведомости</text><text x="32" y="179.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">сохранены и закупленные пусковые опоры: неактивные в выбранном режиме не</text><text x="32" y="200" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">считать установленными в готовом ядре. Демонтаж не даёт зачтённого</text><text x="32" y="220.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">возврата. Высота регулируемой стойки и её крепление требуют проверки в</text><text x="32" y="240.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игре.</text><text x="32" y="276.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-09 · Активная опора выбранного режима</text><text x="32" y="307.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -3.333333; Y -0.666667; основание Z 0 м; world XY -1803.333333,</text><text x="32" y="327.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">2815.333333 м. Верх стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core;</text><text x="32" y="348.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">демонтаж: не указан. Связи: FREIGHT-SCREW.</text><line x1="32" y1="380.45" x2="1068" y2="380.45" stroke="#465256" stroke-width="1.2" /><text x="32" y="398.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-10 · Активная опора выбранного режима</text><text x="32" y="429.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 79; Y 142; основание Z 0 м; world XY -1721, 2958 м. Верх</text><text x="32" y="449.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не указан.</text><text x="32" y="469.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Связи: FREIGHT-WIRE.</text><line x1="32" y1="502" x2="1068" y2="502" stroke="#465256" stroke-width="1.2" /><text x="32" y="520" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-11 · Активная опора выбранного режима</text><text x="32" y="550.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 64.333333; Y 96.333333; основание Z 0 м; world XY -1735.666667,</text><text x="32" y="570.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">2912.333333 м. Верх стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core;</text><text x="32" y="591.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">демонтаж: не указан. Связи: FREIGHT-WIRE.</text><line x1="32" y1="623.55" x2="1068" y2="623.55" stroke="#465256" stroke-width="1.2" /><text x="32" y="641.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-12 · Активная опора выбранного режима</text><text x="32" y="672.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 49.666667; Y 59.666667; основание Z 0 м; world XY -1750.333333,</text><text x="32" y="692.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">2875.666667 м. Верх стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core;</text><text x="32" y="712.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">демонтаж: не указан. Связи: FREIGHT-WIRE.</text><line x1="32" y1="745.1" x2="1068" y2="745.1" stroke="#465256" stroke-width="1.2" /><text x="32" y="763.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-16 · Активная опора выбранного режима</text><text x="32" y="793.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 53; Y -36; основание Z 0 м; world XY -1747, 2780 м. Верх</text><text x="32" y="814.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: concrete-receiver; демонтаж: не</text><text x="32" y="834.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: FREIGHT-CONCRETE.</text><line x1="32" y1="866.65" x2="1068" y2="866.65" stroke="#465256" stroke-width="1.2" /><text x="32" y="884.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-17 · Активная опора выбранного режима</text><text x="32" y="915.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 73; Y -49.5; основание Z 0 м; world XY -1727, 2766.5 м. Верх</text><text x="32" y="935.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: concrete-receiver; демонтаж: не</text><text x="32" y="955.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: FREIGHT-CONCRETE.</text><line x1="32" y1="988.2" x2="1068" y2="988.2" stroke="#465256" stroke-width="1.2" /><text x="32" y="1006.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-18 · Активная опора выбранного режима</text><text x="32" y="1036.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X 53; Y -14; основание Z 0 м; world XY -1747, 2802 м. Верх</text><text x="32" y="1057.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: concrete-receiver; демонтаж: не</text><text x="32" y="1077.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: FREIGHT-CONCRETE.</text><line x1="32" y1="1109.75" x2="1068" y2="1109.75" stroke="#465256" stroke-width="1.2" /><text x="32" y="1127.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-19 · Не входит в активную геометрию выбранного</text><text x="32" y="1152.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">режима</text><text x="32" y="1183.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -38; Y -22; основание Z 0 м; world XY -1838, 2794 м. Верх</text><text x="32" y="1203.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: plate-receiver; демонтаж:</text><text x="32" y="1223.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">finish-core. Связи: FREIGHT-PLATE-COMMISSION.</text><line x1="32" y1="1255.95" x2="1068" y2="1255.95" stroke="#465256" stroke-width="1.2" /><line x1="32" y1="1297.95" x2="1068" y2="1297.95" stroke="#465256" stroke-width="1.2" /><text x="32" y="1322.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1347.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1367.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1387.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
