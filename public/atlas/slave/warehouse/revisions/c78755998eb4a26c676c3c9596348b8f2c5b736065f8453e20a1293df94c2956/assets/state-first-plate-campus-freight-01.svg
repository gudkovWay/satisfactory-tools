first-plate"],</text><text x="475" y="785.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"ownerProjectId": "warehouse", "rate": 80,</text><text x="475" y="804.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"schematic": true, "selectedOperatingState":</text><text x="475" y="823.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">"first-plate", "stageIds":</text><text x="475" y="841.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">["plate-receiver"]}</text><text x="475" y="868.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="700" fill="#20282b">Точные вершины: № [worldX, worldY,</text><text x="475" y="887.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="700" fill="#20282b">relativeZ], м</text><text x="475" y="906.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">1: [-1856, 2776, 5.5]</text><text x="475" y="925.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">2: [-1838, 2794, 5.5]</text><text x="475" y="944.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">3: [-1792, 2824, 5.5]</text><text x="475" y="963.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">4: [-1792, 2824, 1.5]</text><text x="475" y="981.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">5: [-1792, 2826.8, 1.5]</text><text x="475" y="1000.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start"