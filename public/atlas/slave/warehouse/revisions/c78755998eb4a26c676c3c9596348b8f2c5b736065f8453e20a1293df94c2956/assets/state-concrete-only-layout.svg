start" font-weight="400" fill="#20282b">5×10×4</text><line x1="1020" y1="288.2" x2="1768" y2="288.2" stroke="#c5cbc8" stroke-width="1.2" /><text x="1020" y="316.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">Координаты XY: центры; Z: основание. Конверт осевой,</text><text x="1020" y="335.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">повторно не поворачивается. Частота в этой таблице</text><text x="1020" y="353.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">округлена до 0.001%; точное исходное значение сохранено в</text><text x="1020" y="372.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">документе. Поворот: rotationDeg в осях проекта, не</text><text x="1020" y="391.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">подтверждение native yaw. unknown: rotationDeg не задан;</text><text x="1020" y="410.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">направление не предполагается. Полные порты P,</text><text x="1020" y="429.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">componentId и processId: сборочные листы этого уровня по</text><text x="1020" y="448.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">точному ряду Y; выберите то же состояние. Отсутствующие</text><text x="1020" y="467" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">поля и аннотации: лист ограничений выпуска.</text><line x1="100" y1="713.1" x2="920" y2="713.1" stroke="#465256" stroke-width="1.2" /><line x1="100" y1="682.1" x2="100" y2="718.1" stroke="#465256" stroke-width="1.2" /><line x1="96" y1="717.1" x2="104" y2="709.1" stroke="#465256" stroke-width="1.2" /><line x1="920" y1="682.1" x2="920" y2="718.1" stroke="#465256" stroke-width="1.2" /><line x1="916" y1="717.1" x2="924" y2="709.1" stroke="#465256" stroke-width="1.2" /><text x="510" y="736.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b">80 м · 10 модулей по 8 м</text><line x1="62" y1="185.1" x2="62" y2="677.1" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="185.1" x2="95" y2="185.1" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="189.1" x2="66" y2="181.1" stroke="#465256" stroke-width="1.2" /><line x1="57" y1="677.1" x2="95" y2="677.1" stroke="#465256" stroke-width="1.2" /><line x1="58" y1="681.1" x2="66" y2="673.1" stroke="#465256" stroke-width="1.2" /><text x="47" y="431.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" font-weight="400" fill="#20282b" transform="rotate(-90 47 431.1)">48 м</text><text x="32" y="772.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Оси через 8 м. X вправо; +Y вверх. Координаты машин заданы по</text><text x="32" y="792.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">центру. Оранжевый контур: явный осевой конверт или footprint, не</text><text x="32" y="812.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">коллизия и не игровой меш. Штриховка: отдельная зона</text><text x="32" y="833" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">обслуживания или резерв R. Пунктир: граница обслуживания. Серые</text><text x="32" y="853.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки: оплачиваемые плиты; тёплые клетки: первый пуск. Пустые</text><text x="32" y="873.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">клетки не означают готовый пол.</text><line x1="60" y1="923.9" x2="60" y2="897.9" stroke="#465256" stroke-width="1.2" marker-end="url(#arrow)" /><text x="77" y="913.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="13" text-anchor="start" font-weight="400" fill="#20282b">+Y · ось проекта, не направление процесса</text><line x1="32" y1="962.9" x2="1768" y2="962.9" stroke="#465256" stroke-width="1.2" /><text x="32" y="987.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1012.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы и грани электрических якорей не проверены.</text><text x="32" y="1032.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Контейнерам питание не требуется.</text></svg>
