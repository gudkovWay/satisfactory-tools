<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 535" width="1100" height="535"><title id="title">Недостающие поля и ограничения инженерного выпуска</title><desc id="desc">Адресный склад · first-plate · warehouse · ревизия 6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="535" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Недостающие поля и ограничения инженерного</text><text x="32" y="70.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">выпуска</text><text x="32" y="111.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Адресный склад · first-plate · warehouse · ревизия</text><text x="32" y="131.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb</text><line x1="32" y1="170.2" x2="1068" y2="170.2" stroke="#20282b" stroke-width="1.2" /><text x="32" y="194.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Поля ниже нужны для достоверной планировки. Исходные количества, частоты и</text><text x="32" y="214.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">цели сохранены. Листы не становятся проверкой игры даже после заполнения</text><text x="32" y="234.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">полей.</text><text x="32" y="273.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Пропуски поддерживаемых полей не обнаружены. Это не подтверждение</text><text x="32" y="293.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">коллизий, мощности, баланса или игровых портов.</text><line x1="32" y1="398.2" x2="1068" y2="398.2" stroke="#465256" stroke-width="1.2" /><text x="32" y="423.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="447.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="467.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="488.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
