<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1100 1410" width="1100" height="1410"><title id="title">Опоры конвейеров · ведомость монтажа · 1/3</title><desc id="desc">Адресный склад · warehouse · ревизия 6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb. Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</desc><rect x="0" y="0" width="1100" height="1410" fill="#faf9f5" stroke="none" stroke-width="1.2" /><defs><pattern id="reserve" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#465256" stroke-width=".7" fill="none" /></pattern><pattern id="clearance" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,9 L9,0 M7,11 L11,7" stroke="#7c8587" stroke-width=".7" fill="none" /></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#20282b" /></marker></defs><text x="32" y="36" font-family="Onest, DejaVu Sans, sans-serif" font-size="24" text-anchor="start" font-weight="700" fill="#20282b">Опоры конвейеров · ведомость монтажа · 1/3</text><text x="32" y="76.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Адресный склад · warehouse · ревизия</text><text x="32" y="97.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">6d5e6ae63202406f6c7ecdd2eb2c96edd624dc20281eb5317472c5eff4cf19fb</text><line x1="32" y1="135.4" x2="1068" y2="135.4" stroke="#20282b" stroke-width="1.2" /><text x="32" y="159.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Опоры оплачены отдельно от лент и электростолбов. В основной ведомости</text><text x="32" y="179.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">сохранены и закупленные пусковые опоры: неактивные в выбранном режиме не</text><text x="32" y="200" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">считать установленными в готовом ядре. Демонтаж не даёт зачтённого</text><text x="32" y="220.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">возврата. Высота регулируемой стойки и её крепление требуют проверки в</text><text x="32" y="240.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">игре.</text><text x="32" y="276.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-01 · Активная опора выбранного режима</text><text x="32" y="307.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -86; Y -4; основание Z 0 м; world XY -1886, 2812 м. Верх</text><text x="32" y="327.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не указан.</text><text x="32" y="348.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Связи: FREIGHT-PLATE.</text><line x1="32" y1="380.45" x2="1068" y2="380.45" stroke="#465256" stroke-width="1.2" /><text x="32" y="398.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-02 · Активная опора выбранного режима</text><text x="32" y="429.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -54.666667; Y 0; основание Z 0 м; world XY -1854.666667, 2816</text><text x="32" y="449.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">м. Верх стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не</text><text x="32" y="469.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: FREIGHT-PLATE.</text><line x1="32" y1="502" x2="1068" y2="502" stroke="#465256" stroke-width="1.2" /><text x="32" y="520" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-03 · Активная опора выбранного режима</text><text x="32" y="550.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -23.333333; Y 4; основание Z 0 м; world XY -1823.333333, 2820</text><text x="32" y="570.95" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">м. Верх стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не</text><text x="32" y="591.25" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: FREIGHT-PLATE.</text><line x1="32" y1="623.55" x2="1068" y2="623.55" stroke="#465256" stroke-width="1.2" /><text x="32" y="641.55" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-04 · Активная опора выбранного режима</text><text x="32" y="672.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -70; Y -8; основание Z 0 м; world XY -1870, 2808 м. Верх</text><text x="32" y="692.5" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не указан.</text><text x="32" y="712.8" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Связи: FREIGHT-ROD.</text><line x1="32" y1="745.1" x2="1068" y2="745.1" stroke="#465256" stroke-width="1.2" /><text x="32" y="763.1" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-05 · Активная опора выбранного режима</text><text x="32" y="793.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -41; Y -3.333333; основание Z 0 м; world XY -1841, 2812.666667</text><text x="32" y="814.05" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">м. Верх стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не</text><text x="32" y="834.35" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: FREIGHT-ROD.</text><line x1="32" y1="866.65" x2="1068" y2="866.65" stroke="#465256" stroke-width="1.2" /><text x="32" y="884.65" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-06 · Активная опора выбранного режима</text><text x="32" y="915.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -12; Y 1.333333; основание Z 0 м; world XY -1812, 2817.333333</text><text x="32" y="935.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">м. Верх стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не</text><text x="32" y="955.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">указан. Связи: FREIGHT-ROD.</text><line x1="32" y1="988.2" x2="1068" y2="988.2" stroke="#465256" stroke-width="1.2" /><text x="32" y="1006.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-07 · Активная опора выбранного режима</text><text x="32" y="1036.85" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -62; Y -10; основание Z 0 м; world XY -1862, 2806 м. Верх</text><text x="32" y="1057.15" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не указан.</text><text x="32" y="1077.45" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Связи: FREIGHT-SCREW.</text><line x1="32" y1="1109.75" x2="1068" y2="1109.75" stroke="#465256" stroke-width="1.2" /><text x="32" y="1127.75" font-family="Onest, DejaVu Sans, sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#20282b">BELT-SUPPORT-08 · Активная опора выбранного режима</text><text x="32" y="1158.4" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Локально X -18; Y -3; основание Z 0 м; world XY -1818, 2813 м. Верх</text><text x="32" y="1178.7" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">стойки: Z 5.5 м; пятно 1 × 2 м. Монтаж: finish-core; демонтаж: не указан.</text><text x="32" y="1199" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Связи: FREIGHT-SCREW.</text><line x1="32" y1="1231.3" x2="1068" y2="1231.3" stroke="#465256" stroke-width="1.2" /><line x1="32" y1="1273.3" x2="1068" y2="1273.3" stroke="#465256" stroke-width="1.2" /><text x="32" y="1298.3" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Инженерный конверт. Коллизии, порты и размещение в игре не проверены.</text><text x="32" y="1322.6" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">Порты: только явные schematic-точки из массива ports; нативные трансформы</text><text x="32" y="1342.9" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">и грани электрических якорей не проверены. Контейнерам питание не</text><text x="32" y="1363.2" font-family="Onest, DejaVu Sans, sans-serif" font-size="14" text-anchor="start" font-weight="400" fill="#20282b">требуется.</text></svg>
