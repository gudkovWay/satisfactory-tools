e="#385057" stroke-width="1" stroke-dasharray=""/><rect x="95" y="155" width="600.0" height="800.0" fill="none" stroke="#d5d9c8" stroke-width="2"/><text x="95.0" y="143" font-size="12" fill="#d9e4df" font-weight="normal">320</text><text x="495.0" y="143" font-size="12" fill="#d9e4df" font-weight="normal">352</text><text x="48" y="155.0" font-size="12" fill="#d9e4df" font-weight="normal">256</text><text x="48" y="555.0" font-size="12" fill="#d9e4df" font-weight="normal">288</text><text x="48" y="955.0" font-size="12" fill="#d9e4df" font-weight="normal">320</text><rect x="495.0" y="155" width="100.0" height="800.0" fill="#32585d" stroke="#6bb4ba" stroke-width="1"/><text x="499.0" y="174" font-size="13" fill="#d9e4df" font-weight="normal">8м</text><line x1="295.0" y1="161" x2="295.0" y2="949.0" stroke="#bcb883" stroke-width="3" stroke-dasharray=""/><line x1="345.0" y1="161" x2="345.0" y2="949.0" stroke="#9acbd4" stroke-width="3" stroke-dasharray=""/><line x1="395.0" y1="161" x2="395.0" y2="949.0" stroke="#bd9d78" stroke-width="3" stroke-dasharray=""/><line x1="445.0" y1="161" x2="445.0" y2="949.0" stroke="#aaa0c3" stroke-width="3" stroke-dasharray=""/><text x="1080" y="165" font-size="20" fill="#d9e4df" font-weight="normal">Коридор магистралей</text><text x="1080" y="200" font-size="16" fill="#d9e4df" font-weight="normal">T0 вход сырья / полуфабрикатов</text><text x="1080" y="228" font-size="16" fill="#d9e4df" font-weight="normal">T1 возврат готовых изделий</text><text x="1080" y="256" font-size="16" fill="#d9e4df" font-weight="normal">T2 вода / отдельный HOR</text><text x="1080" y="284" font-size="16" fill="#d9e4df" font-weight="normal">T3 кабель на стене</text><text x="1080" y="312" font-size="16" fill="#d9e4df" font-weight="normal">Проход8м не занимать лентами</text><text x="1080" y="340" font-size="16" fill="#d9e4df" font-weight="normal">Под машиной: отдельный lift/порт</text><text x="1080" y="368" font-size="16" fill="#d9e4df" font-weight="normal">Фактические сокеты — по образцу</text><text x="1080" y="396" font-size="16" fill="#d9e4df" font-weight="normal">Ряды не объединять одной узкой лентой</text><text x="1080" y="480" font-size="16" fill="#d9e4df" font-weight="normal">Каждый цвет — отдельная сеть,</text><text x="1080" y="506" font-size="16" fill="#d9e4df" font-weight="normal">не общая труба смешанных жидкостей.</text><text x="1080" y="910" font-size="17" fill="#d9e4df" font-weight="normal">Клетка машины ≠ её корпус.</text><text x="1080" y="938" font-size="16" fill="#d9e4df" font-weight="normal">За корпусом: ленты и питание.</text><text x="1080" y="966" font-size="16" fill="#d9e4df" font-weight="normal">В проходе: только движение.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">Локальные метры · +X к морю / +Y вдоль берега · сетка8м · координаты мира ещё не закреплены</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты — резервы габарита, не выгруженные игровые меши.</text></g></svg>