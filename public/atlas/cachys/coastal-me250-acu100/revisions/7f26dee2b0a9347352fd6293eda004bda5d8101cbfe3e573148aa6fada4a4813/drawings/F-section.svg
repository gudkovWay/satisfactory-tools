ие32…40; крыша52.</text><text x="100" y="216" font-size="18" fill="#d9e4df" font-weight="normal">Ядро16×24: проём6клеток наFT1/F1; не ставить перекрытие над маршами.</text><text x="100" y="1010" font-size="18" fill="#d9e4df" font-weight="normal">Подводные опоры нижеz0: высота неизвестна до промера дна; не рисовать парящий фундамент.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">Локальные метры · +X к морю / +Y вдоль берега · сетка8м · координаты мира ещё не закреплены</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты — резервы габарита, не выгруженные игровые меши.</text></g></svg>