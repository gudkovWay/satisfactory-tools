<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#18282e"/><g font-family="DejaVu Sans,sans-serif" fill="#d9e4df"><text x="45" y="52" font-size="29" font-weight="700">Типовой модуль8×16м / до тиражирования</text><text x="45" y="82" font-size="16" fill="#aebfbe">Образец проверяет фундамент, стену, окно, beam, проход, потолочный свет, socket и одну машину — не весь завод сразу</text><path d="M45 100H1555" stroke="#758c8c"/><rect x="70" y="165" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="201" font-size="23" fill="#d9e4df" font-weight="normal">1 Основание</text><text x="90" y="247" font-size="16" fill="#d9e4df" font-weight="normal">2плиты8×8; верх рабочей плитыz8; техплитаz0</text><rect x="830" y="165" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="850" y="201" font-size="23" fill="#d9e4df" font-weight="normal">2 Структура</text><text x="850" y="247" font-size="16" fill="#d9e4df" font-weight="normal">2бетонных пилона; paintedbeam; не через коллизию машины</text><rect x="70" y="370" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="406" font-size="23" fill="#d9e4df" font-weight="normal">3 Оболочка</text><text x="90" y="452" font-size="16" fill="#d9e4df" font-weight="normal">Два пролёта8×4; один глухой, одинArchitecturewindow</text><rect x="830" y="370" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="850" y="406" font-size="23" fill="#d9e4df" font-weight="normal">4 Маршрут</text><text x="850" y="452" font-size="16" fill="#d9e4df" font-weight="normal">8м главная ось; короткая лестница4м и площадка</text><rect x="70" y="575" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="611" font-size="23" fill="#d9e4df" font-weight="normal">5 Сети</text><text x="90" y="657" font-size="16" fill="#d9e4df" font-weight="normal">Walloutlet; лента/pipe в нижней галерее; lift к порту</text><rect x="830" y="575" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="850" y="611" font-size="23" fill="#d9e4df" font-weight="normal">6 Свет</text><text x="850" y="657" font-size="16" fill="#d9e4df" font-weight="normal">CeilingLight реально освещает; Lights+ только акцент</text><rect x="70" y="780" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="816" font-size="23" fill="#d9e4df" font-weight="normal">7 Проверка</text><text x="90" y="862" font-size="16" fill="#d9e4df" font-weight="normal">Обойти машину, открытьинвентарь, подключить вход/выход</text><rect x="830" y="780" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="850" y="816" font-size="23" fill="#d9e4df" font-weight="normal">8 Повторение</text><text x="850" y="862" font-size="16" fill="#d9e4df" font-weight="normal">Только после проверки размеров фиксировать blueprint</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">Локальные метры · +X к морю / +Y вдоль берега · сетка8м · координаты мира ещё не закреплены</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты — резервы габарита, не выгруженные игровые меши.</text></g></svg>