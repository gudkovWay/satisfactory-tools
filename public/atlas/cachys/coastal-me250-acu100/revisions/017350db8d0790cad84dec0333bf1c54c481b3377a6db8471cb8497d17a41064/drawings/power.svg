<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#18282e"/><g font-family="DejaVu Sans,sans-serif" fill="#d9e4df"><text x="45" y="52" font-size="29" font-weight="700">Энергия и этапный пуск / не путать мощность с доступным резервом</text><text x="45" y="82" font-size="16" fill="#aebfbe">Производственные175машин:61,357GW full installed · ввод80GW включая2GW критических · кокс в гарантию не засчитан</text><path d="M45 100H1555" stroke="#758c8c"/><rect x="70" y="155" width="1460" height="70" fill="#29434a" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="196" font-size="19" fill="#d9e4df" font-weight="normal">Критическая линия 2GW: насосы / SINK / управление / запуск; отдельно от цехов.</text><rect x="70" y="246" width="1460" height="70" fill="#29434a" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="287" font-size="19" fill="#d9e4df" font-weight="normal">До стройки измерить устойчивый резерв сети под обычной нагрузкой.</text><rect x="70" y="337" width="1460" height="70" fill="#29434a" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="378" font-size="19" fill="#d9e4df" font-weight="normal">При нехватке: fuel-аннекс 40×24ф.; четыре банка по 10GW gross.</text><rect x="70" y="428" width="1460" height="70" fill="#29434a" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="469" font-size="19" fill="#d9e4df" font-weight="normal">Один банк: 2RefineryMk.3 + 4FuelGeneratorMk.3 + 1SINK; pureoil180м³/мин.</text><rect x="70" y="519" width="1460" height="70" fill="#29434a" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="560" font-size="19" fill="#d9e4df" font-weight="normal">Все4банка: нефть720, топливо640, смола2400/мин; net&lt;37,331GW до утилит.</text><rect x="70" y="610" width="1460" height="70" fill="#29434a" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="651" font-size="19" fill="#d9e4df" font-weight="normal">Аннекс не входит в основную площадку 70×60ф.</text><rect x="70" y="701" width="1460" height="70" fill="#29434a" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="742" font-size="19" fill="#d9e4df" font-weight="normal">Сначала один опытный банк: проверить HFO/генератор/воду; затем повторить×4.</text><rect x="70" y="792" width="1460" height="70" fill="#29434a" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="833" font-size="19" fill="#d9e4df" font-weight="normal">Пуск: P/W → F → E → ME50 → ACU20 → ступени до250/100.</text><rect x="70" y="883" width="1460" height="70" fill="#29434a" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="924" font-size="19" fill="#d9e4df" font-weight="normal">При аварии выключать конечные цеха, оставляя питание SINK и насосов.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>