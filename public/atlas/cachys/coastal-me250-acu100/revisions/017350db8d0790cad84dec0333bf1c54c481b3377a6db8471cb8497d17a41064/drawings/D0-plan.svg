e="#6bb4ba" stroke-width="1"/><text x="391.72727272727275" y="174" font-size="13" fill="#d9e4df" font-weight="normal">1ф.</text><text x="1080" y="163" font-size="20" fill="#d9e4df" font-weight="normal">Машины / одинаковая частота</text><rect x="152.5" y="212.5" width="52.27272727272727" height="52.27272727272727" fill="#a9bdc8" stroke="#f4ead2" stroke-width="1"/><text x="154.5" y="224.5" font-size="10" fill="#172a2f" font-weight="normal">D-ME1</text><rect x="277.9545454545455" y="212.5" width="52.27272727272727" height="52.27272727272727" fill="#a9bdc8" stroke="#f4ead2" stroke-width="1"/><text x="279.9545454545455" y="224.5" font-size="10" fill="#172a2f" font-weight="normal">D-ME2</text><rect x="403.40909090909093" y="212.5" width="52.27272727272727" height="52.27272727272727" fill="#a9bdc8" stroke="#f4ead2" stroke-width="1"/><text x="405.40909090909093" y="224.5" font-size="10" fill="#172a2f" font-weight="normal">D-ME3</text><rect x="528.8636363636364" y="212.5" width="52.27272727272727" height="52.27272727272727" fill="#a9bdc8" stroke="#f4ead2" stroke-width="1"/><text x="530.8636363636364" y="224.5" font-size="10" fill="#172a2f" font-weight="normal">D-ME4</text><rect x="152.5" y="379.77272727272725" width="52.27272727272727" height="52.27272727272727" fill="#a9bdc8" stroke="#f4ead2" stroke-width="1"/><text x="154.5" y="391.77272727272725" font-size="10" fill="#172a2f" font-weight="normal">D-ACU1</text><rect x="277.9545454545455" y="379.77272727272725" width="52.27272727272727" height="52.27272727272727" fill="#a9bdc8" stroke="#f4ead2" stroke-width="1"/><text x="279.9545454545455" y="391.77272727272725" font-size="10" fill="#172a2f" font-weight="normal">D-ACU2</text><rect x="403.40909090909093" y="379.77272727272725" width="52.27272727272727" height="52.27272727272727" fill="#a9bdc8" stroke="#f4ead2" stroke-width="1"/><text x="405.40909090909093" y="391.77272727272725" font-size="10" fill="#172a2f" font-weight="normal">D-ACU3</text><rect x="528.8636363636364" y="379.77272727272725" width="52.27272727272727" height="52.27272727272727" fill="#a9bdc8" stroke="#f4ead2" stroke-width="1"/><text x="530.8636363636364" y="391.77272727272725" font-size="10" fill="#172a2f" font-weight="normal">D-ACU4</text><text x="1080" y="210" font-size="16" fill="#d9e4df" font-weight="normal">ME: Y52ф.; ACU: Y56ф.</text><text x="1080" y="243" font-size="16" fill="#d9e4df" font-weight="normal">По4буфера, продукты раздельно.</text><text x="1080" y="276" font-size="16" fill="#d9e4df" font-weight="normal">Экспорт250/100, не одна смесь.</text><text x="1080" y="309" font-size="16" fill="#d9e4df" font-weight="normal">Центры X50/53/56/59ф.</text><text x="1080" y="342" font-size="16" fill="#d9e4df" font-weight="normal">Склад не гарантирует throughput.</text><text x="1080" y="910" font-size="17" fill="#d9e4df" font-weight="normal">Клетка машины ≠ её корпус.</text><text x="1080" y="938" font-size="16" fill="#d9e4df" font-weight="normal">За корпусом: ленты и питание.</text><text x="1080" y="966" font-size="16" fill="#d9e4df" font-weight="normal">В проходе: только движение.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>