"955.0" stroke="#385057" stroke-width="1" stroke-dasharray=""/><rect x="95" y="155" width="600.0" height="800.0" fill="none" stroke="#d5d9c8" stroke-width="2"/><text x="95.0" y="143" font-size="12" fill="#d9e4df" font-weight="normal">40</text><text x="495.0" y="143" font-size="12" fill="#d9e4df" font-weight="normal">44</text><text x="48" y="155.0" font-size="12" fill="#d9e4df" font-weight="normal">32</text><text x="48" y="555.0" font-size="12" fill="#d9e4df" font-weight="normal">36</text><text x="48" y="955.0" font-size="12" fill="#d9e4df" font-weight="normal">40</text><rect x="495.0" y="155" width="100.0" height="800.0" fill="#32585d" stroke="#6bb4ba" stroke-width="1"/><text x="499.0" y="174" font-size="13" fill="#d9e4df" font-weight="normal">1ф.</text><text x="1080" y="163" font-size="20" fill="#d9e4df" font-weight="normal">Машины / одинаковая частота</text><rect x="145.0" y="455.0" width="300.0" height="100.0" fill="#b9c7ba" stroke="#f4ead2" stroke-width="1"/><text x="147.0" y="467.0" font-size="10" fill="#172a2f" font-weight="normal">C-PANEL</text><text x="1080" y="210" font-size="16" fill="#d9e4df" font-weight="normal">Один коммутатор на12секторов.</text><text x="1080" y="243" font-size="16" fill="#d9e4df" font-weight="normal">C-PANEL: резерв 3×1ф., не меш.</text><text x="1080" y="276" font-size="16" fill="#d9e4df" font-weight="normal">Критика не выключается сU.</text><text x="1080" y="309" font-size="16" fill="#d9e4df" font-weight="normal">Ядро X44…46 / Y32…34ф.</text><text x="1080" y="342" font-size="16" fill="#d9e4df" font-weight="normal">4марша ×2сл.; проём 2×2ф.</text><rect x="495.0" y="155" width="200.0" height="200.0" fill="#335b61" stroke="#d9d7c5" stroke-width="2"/><text x="1080" y="910" font-size="17" fill="#d9e4df" font-weight="normal">Клетка машины ≠ её корпус.</text><text x="1080" y="938" font-size="16" fill="#d9e4df" font-weight="normal">За корпусом: ленты и питание.</text><text x="1080" y="966" font-size="16" fill="#d9e4df" font-weight="normal">В проходе: только движение.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>