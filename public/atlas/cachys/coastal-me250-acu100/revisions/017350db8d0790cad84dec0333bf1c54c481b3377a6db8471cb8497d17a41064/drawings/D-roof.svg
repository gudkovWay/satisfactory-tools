t-size="18" fill="#d9e4df" font-weight="normal">Опоры по краям прохода,</text><text x="1060" y="222" font-size="18" fill="#d9e4df" font-weight="normal">не внутри него и не в машине.</text><text x="1060" y="254" font-size="18" fill="#d9e4df" font-weight="normal">Колонны на швах клеток.</text><text x="1060" y="286" font-size="18" fill="#d9e4df" font-weight="normal">Стекло: наружная оболочка.</text><text x="1060" y="318" font-size="18" fill="#d9e4df" font-weight="normal">Свет: шаг 2ф. над маршрутом.</text><text x="1060" y="350" font-size="18" fill="#d9e4df" font-weight="normal">Арка SS: 2ф. над крышей,</text><text x="1060" y="382" font-size="18" fill="#d9e4df" font-weight="normal">на ригеле, не пролёт 22ф.</text><text x="1060" y="414" font-size="18" fill="#d9e4df" font-weight="normal">Пробная площадка 3×4ф.; затем</text><text x="1060" y="446" font-size="18" fill="#d9e4df" font-weight="normal">повторять те же пропорции.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>