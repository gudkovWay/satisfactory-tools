<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#18282e"/><g font-family="DejaVu Sans,sans-serif" fill="#d9e4df"><text x="45" y="52" font-size="29" font-weight="700">Пробная площадка 3×4 фундамента / до тиражирования</text><text x="45" y="82" font-size="16" fill="#aebfbe">CC Block 8x8x2 · 12 блоков на техническую плиту и 12 на рабочую · H0 и H4</text><path d="M45 100H1555" stroke="#758c8c"/><rect x="70" y="165" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="201" font-size="23" fill="#d9e4df" font-weight="normal">1 Основание</text><text x="90" y="247" font-size="16" fill="#d9e4df" font-weight="normal">По 12 CC Block на H0 и H4; просвет 3сл.</text><rect x="830" y="165" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="850" y="201" font-size="23" fill="#d9e4df" font-weight="normal">2 Структура</text><text x="850" y="247" font-size="16" fill="#d9e4df" font-weight="normal">2 пилона; painted beam вне машин</text><rect x="70" y="370" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="406" font-size="23" fill="#d9e4df" font-weight="normal">3 Оболочка</text><text x="90" y="452" font-size="16" fill="#d9e4df" font-weight="normal">Два пролёта 1ф.×2сл.; один с окном</text><rect x="830" y="370" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="850" y="406" font-size="23" fill="#d9e4df" font-weight="normal">4 Маршрут</text><text x="850" y="452" font-size="16" fill="#d9e4df" font-weight="normal">Проход 1ф.; подъём 2сл. и площадка</text><rect x="70" y="575" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="611" font-size="23" fill="#d9e4df" font-weight="normal">5 Сети</text><text x="90" y="657" font-size="16" fill="#d9e4df" font-weight="normal">Wall outlet; ленты/трубы снизу; lift к порту</text><rect x="830" y="575" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="850" y="611" font-size="23" fill="#d9e4df" font-weight="normal">6 Свет</text><text x="850" y="657" font-size="16" fill="#d9e4df" font-weight="normal">Ceiling Light: рабочий; Lights+: акцент</text><rect x="70" y="780" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="90" y="816" font-size="23" fill="#d9e4df" font-weight="normal">7 Проверка</text><text x="90" y="862" font-size="16" fill="#d9e4df" font-weight="normal">Manufacturer и Refinery: по очереди</text><rect x="830" y="780" width="710" height="170" fill="#304b52" stroke="#8ea5a5" stroke-width="1"/><text x="850" y="816" font-size="23" fill="#d9e4df" font-weight="normal">8 Повторение</text><text x="850" y="862" font-size="16" fill="#d9e4df" font-weight="normal">После проверки сохранить blueprint</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>