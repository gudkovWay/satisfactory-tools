<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#18282e"/><g font-family="DejaVu Sans,sans-serif" fill="#d9e4df"><text x="45" y="52" font-size="29" font-weight="700">Утиль / гарантированный сброс и необязательный энергозачёт</text><text x="45" y="82" font-size="16" fill="#aebfbe">5175 кокс/мин =2641,741 промышленность +2533,259 потенциальная энергия; SINK fallback выдерживает ВСЕ5175</text><path d="M45 100H1555" stroke="#758c8c"/><rect x="70" y="350" width="280" height="180" fill="#355057" stroke="#8ea5a5" stroke-width="1"/><text x="82" y="398" font-size="23" fill="#d9e4df" font-weight="normal">НПЗ / HOR</text><text x="82" y="440" font-size="17" fill="#d9e4df" font-weight="normal">раздельные коллекторы</text><rect x="420" y="350" width="280" height="180" fill="#355057" stroke="#8ea5a5" stroke-width="1"/><text x="432" y="398" font-size="23" fill="#d9e4df" font-weight="normal">Сталь: приоритет</text><text x="432" y="440" font-size="17" fill="#d9e4df" font-weight="normal">2641,741 кокс/мин</text><rect x="780" y="350" width="280" height="180" fill="#355057" stroke="#8ea5a5" stroke-width="1"/><text x="792" y="398" font-size="23" fill="#d9e4df" font-weight="normal">11×Coal Mk.3</text><text x="792" y="440" font-size="17" fill="#d9e4df" font-weight="normal">до7,600GW gross</text><rect x="1200" y="350" width="310" height="180" fill="#355057" stroke="#8ea5a5" stroke-width="1"/><text x="1212" y="398" font-size="23" fill="#d9e4df" font-weight="normal">3×SINK</text><text x="1212" y="440" font-size="17" fill="#d9e4df" font-weight="normal">3×2000=6000/мин</text><line x1="350" y1="420" x2="420" y2="420" stroke="#d2b478" stroke-width="5" stroke-dasharray=""/><line x1="700" y1="420" x2="780" y2="420" stroke="#d2b478" stroke-width="5" stroke-dasharray=""/><line x1="1060" y1="420" x2="1200" y2="420" stroke="#d2b478" stroke-width="5" stroke-dasharray=""/><line x1="350" y1="500" x2="350" y2="650" stroke="#77adb2" stroke-width="4" stroke-dasharray=""/><line x1="350" y1="650" x2="1350" y2="650" stroke="#77adb2" stroke-width="4" stroke-dasharray=""/><line x1="1350" y1="650" x2="1350" y2="530" stroke="#77adb2" stroke-width="4" stroke-dasharray=""/><text x="70" y="780" font-size="20" fill="#d9e4df" font-weight="normal">Генераторы получают только surplus после промышленных ветвей.</text><text x="70" y="820" font-size="20" fill="#d9e4df" font-weight="normal">Overflow на каждой из трёх независимых линий идёт в SINK; не одна лента5175/2000.</text><text x="70" y="860" font-size="20" fill="#d9e4df" font-weight="normal">SINK и насосы — критическая линия, не выключатель генераторного участка.</text><text x="70" y="900" font-size="20" fill="#d9e4df" font-weight="normal">При полном промышленном буфере весь кокс уходит вSINK: нефтехимия не обязана остановиться.</text><text x="70" y="940" font-size="20" fill="#d9e4df" font-weight="normal">RP steam/CO₂, HFO-water hooks и зачёт энергии — только после пилота одного агрегата.</text><text x="70" y="980" font-size="20" fill="#d9e4df" font-weight="normal">Резерв воды U: до4559,867м³/мин консервативно; ожидаемые911,973 не выдавать за runtime.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">Локальные метры · +X к морю / +Y вдоль берега · сетка8м · координаты мира ещё не закреплены</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты — резервы габарита, не выгруженные игровые меши.</text></g></svg>