<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="#18282e"/><g font-family="DejaVu Sans,sans-serif" fill="#d9e4df"><text x="45" y="52" font-size="29" font-weight="700">C · разрез / высоты и лестничный маршрут</text><text x="45" y="82" font-size="16" fill="#aebfbe">Рабочая плита8м; техническая0м · верх 36м · модульная оболочка, без гигантской свободной арки</text><path d="M45 100H1555" stroke="#758c8c"/><line x1="100" y1="900" x2="724" y2="900" stroke="#d3dccc" stroke-width="3" stroke-dasharray=""/><text x="48" y="905" font-size="17" fill="#d9e4df" font-weight="normal">+0</text><line x1="100" y1="796" x2="724" y2="796" stroke="#d3dccc" stroke-width="3" stroke-dasharray=""/><text x="48" y="801" font-size="17" fill="#d9e4df" font-weight="normal">+8</text><line x1="100" y1="588" x2="724" y2="588" stroke="#d3dccc" stroke-width="3" stroke-dasharray=""/><text x="48" y="593" font-size="17" fill="#d9e4df" font-weight="normal">+24</text><line x1="100" y1="432" x2="724" y2="432" stroke="#d3dccc" stroke-width="3" stroke-dasharray=""/><text x="48" y="437" font-size="17" fill="#d9e4df" font-weight="normal">+36</text><rect x="152.0" y="744" width="312" height="52" fill="#b9c7ba" stroke="#8ea5a5" stroke-width="1"/><text x="154.0" y="789" font-size="14" fill="#18282e" font-weight="normal">C-PANEL</text><line x1="100" y1="900" x2="100" y2="432" stroke="#c0c6ba" stroke-width="5" stroke-dasharray=""/><line x1="724" y1="900" x2="724" y2="432" stroke="#c0c6ba" stroke-width="5" stroke-dasharray=""/><text x="100" y="180" font-size="20" fill="#d9e4df" font-weight="normal">C: вход/выключателиz8; обзор/операторский мостz24; 4марша по4м.</text><text x="100" y="1010" font-size="18" fill="#d9e4df" font-weight="normal">Подводные опоры нижеz0: высота неизвестна до промера дна; не рисовать парящий фундамент.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">Локальные метры · +X к морю / +Y вдоль берега · сетка8м · координаты мира ещё не закреплены</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты — резервы габарита, не выгруженные игровые меши.</text></g></svg>