f" font-weight="normal">R24-06</text><line x1="278.33333333333337" y1="788.6666666666667" x2="278.33333333333337" y2="796.6666666666667" stroke="#e6c66c" stroke-width="2" stroke-dasharray=""/><text x="1080" y="163" font-size="20" fill="#d9e4df" font-weight="normal">Машины / одинаковая частота</text><text x="1080" y="197" font-size="17" fill="#d9e4df" font-weight="normal">R24 · 6 × 88.889%</text><text x="1080" y="220" font-size="14" fill="#b9c9c6" font-weight="normal">EasyAlt: Encased Industrial Pipe</text><rect x="761.6666666666667" y="155.0" width="66.66666666666667" height="100.0" fill="#335b61" stroke="#d9d7c5" stroke-width="2"/><text x="1080" y="270" font-size="15" fill="#d9e4df" font-weight="normal">Ядро X42…44 / Y0…3ф.</text><text x="1080" y="296" font-size="15" fill="#d9e4df" font-weight="normal">6 подъёмов×2сл.: H4→H16</text><text x="1080" y="910" font-size="17" fill="#d9e4df" font-weight="normal">Клетка машины ≠ её корпус.</text><text x="1080" y="938" font-size="16" fill="#d9e4df" font-weight="normal">За корпусом: ленты и питание.</text><text x="1080" y="966" font-size="16" fill="#d9e4df" font-weight="normal">В проходе: только движение.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>