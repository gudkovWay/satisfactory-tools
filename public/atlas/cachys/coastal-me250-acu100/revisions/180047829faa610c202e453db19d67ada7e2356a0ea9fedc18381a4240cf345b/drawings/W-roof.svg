rmal">повторять те же пропорции.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>