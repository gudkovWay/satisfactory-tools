e="#c0c6ba" stroke-width="5" stroke-dasharray=""/><text x="100" y="180" font-size="20" fill="#d9e4df" font-weight="normal">Входы лент под полом; сборка на H4; свет/балки выше машин.</text><text x="100" y="1010" font-size="18" fill="#d9e4df" font-weight="normal">Опоры ниже H0: количество вертикальных слоёв определить по дну; плиты не должны висеть.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>