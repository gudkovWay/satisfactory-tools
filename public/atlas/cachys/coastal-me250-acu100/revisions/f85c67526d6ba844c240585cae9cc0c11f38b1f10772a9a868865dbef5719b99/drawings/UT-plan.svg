" font-size="13" fill="#d9e4df" font-weight="normal">1ф.</text><line x1="427.22222222222223" y1="161" x2="427.22222222222223" y2="864.5555555555557" stroke="#bcb883" stroke-width="3" stroke-dasharray=""/><line x1="452.7777777777778" y1="161" x2="452.7777777777778" y2="864.5555555555557" stroke="#9acbd4" stroke-width="3" stroke-dasharray=""/><line x1="478.33333333333337" y1="161" x2="478.33333333333337" y2="864.5555555555557" stroke="#bd9d78" stroke-width="3" stroke-dasharray=""/><line x1="503.8888888888889" y1="161" x2="503.8888888888889" y2="864.5555555555557" stroke="#aaa0c3" stroke-width="3" stroke-dasharray=""/><text x="1080" y="165" font-size="20" fill="#d9e4df" font-weight="normal">Коридор магистралей</text><text x="1080" y="200" font-size="16" fill="#d9e4df" font-weight="normal">T0 вход сырья / полуфабрикатов</text><text x="1080" y="228" font-size="16" fill="#d9e4df" font-weight="normal">T1 возврат готовых изделий</text><text x="1080" y="256" font-size="16" fill="#d9e4df" font-weight="normal">T2 вода / отдельный HOR</text><text x="1080" y="284" font-size="16" fill="#d9e4df" font-weight="normal">T3 кабель на стене</text><text x="1080" y="312" font-size="16" fill="#d9e4df" font-weight="normal">Проход 1ф. не занимать лентами</text><text x="1080" y="340" font-size="16" fill="#d9e4df" font-weight="normal">Под машиной: отдельный lift/порт</text><text x="1080" y="368" font-size="16" fill="#d9e4df" font-weight="normal">Фактические сокеты: по образцу</text><text x="1080" y="396" font-size="16" fill="#d9e4df" font-weight="normal">Ряды не объединять узкой лентой</text><text x="1080" y="480" font-size="16" fill="#d9e4df" font-weight="normal">Каждый цвет : отдельная сеть,</text><text x="1080" y="506" font-size="16" fill="#d9e4df" font-weight="normal">не общая труба смешанных жидкостей.</text><text x="1080" y="910" font-size="17" fill="#d9e4df" font-weight="normal">Клетка машины ≠ её корпус.</text><text x="1080" y="938" font-size="16" fill="#d9e4df" font-weight="normal">За корпусом: ленты и питание.</text><text x="1080" y="966" font-size="16" fill="#d9e4df" font-weight="normal">В проходе: только движение.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>