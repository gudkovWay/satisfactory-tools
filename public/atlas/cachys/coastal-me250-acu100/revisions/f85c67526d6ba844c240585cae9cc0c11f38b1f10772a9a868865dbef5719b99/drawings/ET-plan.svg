>Коридор магистралей</text><text x="1080" y="200" font-size="16" fill="#d9e4df" font-weight="normal">T0 вход сырья / полуфабрикатов</text><text x="1080" y="228" font-size="16" fill="#d9e4df" font-weight="normal">T1 возврат готовых изделий</text><text x="1080" y="256" font-size="16" fill="#d9e4df" font-weight="normal">T2 вода / отдельный HOR</text><text x="1080" y="284" font-size="16" fill="#d9e4df" font-weight="normal">T3 кабель на стене</text><text x="1080" y="312" font-size="16" fill="#d9e4df" font-weight="normal">Проход 1ф. не занимать лентами</text><text x="1080" y="340" font-size="16" fill="#d9e4df" font-weight="normal">Под машиной: отдельный lift/порт</text><text x="1080" y="368" font-size="16" fill="#d9e4df" font-weight="normal">Фактические сокеты: по образцу</text><text x="1080" y="396" font-size="16" fill="#d9e4df" font-weight="normal">Ряды не объединять узкой лентой</text><rect x="192.0" y="262.0" width="6" height="6" fill="#d9b76d" stroke="#8ea5a5" stroke-width="1"/><line x1="195.0" y1="265.0" x2="345.0" y2="265.0" stroke="#9eb3b0" stroke-width="0.8" stroke-dasharray=""/><rect x="312.0" y="262.0" width="6" height="6" fill="#d9b76d" stroke="#8ea5a5" stroke-width="1"/><line x1="315.0" y1="265.0" x2="345.0" y2="265.0" stroke="#9eb3b0" stroke-width="0.8" stroke-dasharray=""/><rect x="472.0" y="262.0" width="6" height="6" fill="#d9b76d" stroke="#8ea5a5" stroke-width="1"/><line x1="475.0" y1="265.0" x2="345.0" y2="265.0" stroke="#9eb3b0" stroke-width="0.8" stroke-dasharray=""/><rect x="592.0" y="262.0" width="6" height="6" fill="#d9b76d" stroke="#8ea5a5" stroke-width="1"/><line x1="595.0" y1="265.0" x2="345.0" y2="265.0" stroke="#9eb3b0" stroke-width="0.8" stroke-dasharray=""/><rect x="192.0" y="402.0" width="6" height="6" fill="#d9b76d" stroke="#8ea5a5" stroke-width="1"/><line x1="195.0" y1="405.0" x2="345.0" y2="405.0" stroke="#9eb3b0" stroke-width="0.8" stroke-dasharray=""/><rect x="312.0" y="402.0" width="6" height="6" fill="#d9b76d" stroke="#8ea5a5" stroke