" fill="#d9b76d" stroke="#8ea5a5" stroke-width="1"/><line x1="595.0" y1="685.0" x2="345.0" y2="685.0" stroke="#9eb3b0" stroke-width="0.8" stroke-dasharray=""/><rect x="192.0" y="822.0" width="6" height="6" fill="#d9b76d" stroke="#8ea5a5" stroke-width="1"/><line x1="195.0" y1="825.0" x2="345.0" y2="825.0" stroke="#9eb3b0" stroke-width="0.8" stroke-dasharray=""/><rect x="312.0" y="822.0" width="6" height="6" fill="#d9b76d" stroke="#8ea5a5" stroke-width="1"/><line x1="315.0" y1="825.0" x2="345.0" y2="825.0" stroke="#9eb3b0" stroke-width="0.8" stroke-dasharray=""/><text x="1080" y="480" font-size="16" fill="#d9e4df" font-weight="normal">Каждый цвет : отдельная сеть,</text><text x="1080" y="506" font-size="16" fill="#d9e4df" font-weight="normal">не общая труба смешанных жидкостей.</text><text x="1080" y="910" font-size="17" fill="#d9e4df" font-weight="normal">Клетка машины ≠ её корпус.</text><text x="1080" y="938" font-size="16" fill="#d9e4df" font-weight="normal">За корпусом: ленты и питание.</text><text x="1080" y="966" font-size="16" fill="#d9e4df" font-weight="normal">В проходе: только движение.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>