й.</text><text x="1080" y="910" font-size="17" fill="#d9e4df" font-weight="normal">Клетка машины ≠ её корпус.</text><text x="1080" y="938" font-size="16" fill="#d9e4df" font-weight="normal">За корпусом: ленты и питание.</text><text x="1080" y="966" font-size="16" fill="#d9e4df" font-weight="normal">В проходе: только движение.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">CC Block 8x8x2 · X/Y в фундаментах от угла P · H в слоях от верха техплиты · мир не привязан</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты : резервы габарита, не выгруженные игровые меши.</text></g></svg>