mal">SINK</text><text x="992.0" y="790.8" font-size="16" fill="#d9e4df" font-weight="normal">Oil180 → Fuel160</text><text x="992.0" y="836.4" font-size="16" fill="#d9e4df" font-weight="normal">Resin600 → SINK</text><text x="992.0" y="878.1999999999999" font-size="15" fill="#d9e4df" font-weight="normal">10GWgross; net меньше</text><text x="70" y="955" font-size="18" fill="#d9e4df" font-weight="normal">R1/R2: RefineryMk.3 по10%,100циклов/мин при100% → по10циклов.</text><text x="70" y="985" font-size="18" fill="#d9e4df" font-weight="normal">На банк: oil180, fuel160, resin600/мин; 4генератора по2,5GW.</text><text x="70" y="1015" font-size="18" fill="#d9e4df" font-weight="normal">Четыре банка: oil720, fuel640, resin2400/мин; net&lt;37,3312GW.</text><text x="70" y="1045" font-size="18" fill="#d9e4df" font-weight="normal">Габариты G: резерв20×24; R:10×22; порты/коллизии проверяет опытный банк.</text><text x="45" y="1080" font-size="15" fill="#d9e4df" font-weight="normal">Локальные метры · +X к морю / +Y вдоль берега · сетка8м · координаты мира ещё не закреплены</text><text x="45" y="1104" font-size="14" fill="#aebfbe" font-weight="normal">Точная проектная расстановка; корпуса/порты — резервы габарита, не выгруженные игровые меши.</text></g></svg>